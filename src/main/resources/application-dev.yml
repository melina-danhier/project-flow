spring:
  config:
    import: "optional:file:./.env[.properties]"

  thymeleaf:
    cache: false

  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

projectflow:
  ai:
    provider: ${PROJECTFLOW_AI_PROVIDER:stub}
    stub:
      # no-problems, risk, assumption, critical-assumption, conflict, multiple-warnings, multiple-issues, dynamic
      pre-check-scenario: ${PROJECTFLOW_AI_STUB_PRE_CHECK_SCENARIO:critical-assumption}
      # with-dates, without-dates
      generation-scenario: with-dates
