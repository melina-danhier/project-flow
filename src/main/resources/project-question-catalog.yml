# ============================================================================
# ProjectFlow – AI Project Question Catalog
# ============================================================================
# Structure:
#   common.availableTime   → always shown FIRST
#   common.finalConstraints → always shown LAST
#   categories.<ENUM_NAME>.questions → questions relevant to every subcategory
#   categories.<ENUM_NAME>.subcategories.<ENUM_NAME>.questions → per subcategory
# Category questions must not repeat a subcategory question. Questions that only
# apply when no concrete subcategory fits belong to the matching OTHER_* entry.
# ============================================================================

common:
  availableTime:
    key: availableTime
    label: "Wie viel Zeit kannst du ungefähr für das Projekt aufbringen?"
    placeholder: "z. B. etwa 3 Stunden pro Woche oder nur am Wochenende"

  finalConstraints:
    key: constraints
    label: "Was sollten wir zusätzlich noch berücksichtigen?"
    placeholder: "z. B. ein begrenztes Budget, feste Termine oder vorhandene Materialien"

categories:

  # =========================================================================
  # EDUCATION – Bildung und Studium
  # =========================================================================

  EDUCATION:
    subcategories:
      PRESENTATION_OR_REPORT:
        questions:
          - key: topic
            label: "Was ist das Thema der Präsentation oder des Referats?"
            placeholder: "z. B. Künstliche Intelligenz im Bildungsbereich"
          - key: targetAudience
            label: "Vor wem wird die Präsentation gehalten?"
            placeholder: "z. B. Studierende im Seminar, Schulklasse oder Prüfungskommission"
          - key: contentRequirements
            label: "Gibt es inhaltliche oder formale Vorgaben?"
            placeholder: "z. B. mindestens 15 Minuten, eine feste Gliederung oder bestimmte Quellen"
          - key: desiredDeliverables
            label: "Welche Bestandteile soll das Ergebnis umfassen?"
            placeholder: "z. B. Folien, Handout, Notizen für den Vortrag"

      EXAM_PREPARATION:
        questions:
          - key: examSubject
            label: "Für welche Prüfung oder welches Fach lernst du?"
            placeholder: "z. B. Mathematik-Klausur, Staatsexamen oder Sprachzertifikat B2"
          - key: examTopics
            label: "Welche Themen oder Stoffgebiete umfasst die Prüfung?"
            placeholder: "z. B. Analysis, Lineare Algebra und Stochastik"
          - key: currentKnowledge
            label: "Wie schätzt du deinen bisherigen Wissensstand ein?"
            placeholder: "z. B. Grundlagen sind bekannt, aber einige Themen muss ich noch vertiefen"
          - key: examDate
            label: "Wann findet die Prüfung statt?"
            placeholder: "z. B. in 6 Wochen, am 15. März"

      LEARNING_PLAN:
        questions:
          - key: learningGoal
            label: "Was möchtest du lernen oder besser verstehen?"
            placeholder: "z. B. Python-Grundlagen, Gitarre spielen oder Buchführung"
          - key: learningTopics
            label: "Welche Themen oder Bereiche umfasst dein Lernziel?"
            placeholder: "z. B. Variablen, Schleifen, Funktionen und Datenstrukturen"
          - key: currentKnowledge
            label: "Was weißt du bereits über das Thema?"
            placeholder: "z. B. kompletter Anfänger oder Grundlagen sind schon vorhanden"
          - key: focusAreas
            label: "Gibt es besondere Schwerpunkte, auf die du dich konzentrieren möchtest?"
            placeholder: "z. B. praktische Übungen, Theorie oder bestimmte Teilgebiete"

      TERM_PAPER:
        questions:
          - key: paperTopic
            label: "Was ist das Thema oder die Fragestellung deiner Arbeit?"
            placeholder: "z. B. Auswirkungen sozialer Medien auf das Kaufverhalten"
          - key: paperRequirements
            label: "Welche formalen oder inhaltlichen Vorgaben gibt es?"
            placeholder: "z. B. 15–20 Seiten, APA-Zitation, mindestens 10 Quellen"
          - key: currentProgress
            label: "Wie weit bist du bisher mit der Arbeit?"
            placeholder: "z. B. Thema gerade erst gewählt, Gliederung steht schon"

      THESIS:
        questions:
          - key: researchQuestion
            label: "Was ist das Thema oder die Forschungsfrage?"
            placeholder: "z. B. Einfluss von Gamification auf die Lernmotivation"
          - key: currentProgress
            label: "Wie weit bist du bisher mit deiner Arbeit?"
            placeholder: "z. B. Exposé ist eingereicht, Literaturrecherche läuft"
          - key: methodology
            label: "Wie möchtest du vorgehen und welche praktischen Teile sind geplant?"
            placeholder: "z. B. eine Umfrage durchführen, einen Prototyp entwickeln oder Literatur auswerten"
          - key: formalRequirements
            label: "Welche formalen Vorgaben gibt es?"
            placeholder: "z. B. 60–80 Seiten, IEEE-Stil, Abgabe bis Ende des Semesters"

      OTHER_EDUCATION:
        questions:
          - key: educationGoal
            label: "Was möchtest du erreichen?"
            placeholder: "z. B. ein neues Bildungsthema erschließen oder ein Studienvorhaben abschließen"

  # =========================================================================
  # SOFTWARE_TECHNOLOGY – Software und Technik
  # =========================================================================
  SOFTWARE_TECHNOLOGY:
    questions:
      - key: technicalExperience
        label: "Wie viel technische Erfahrung bringst du mit?"
        placeholder: "z. B. keine Vorerfahrung, Grundkenntnisse oder praktische Erfahrung"

    subcategories:
      SOFTWARE_PROJECT:
        questions:
          - key: goalAndScope
            label: "Welche Funktionen soll die Software haben?"
            placeholder: "z. B. eine Verwaltung für Rezepte mit Suchfunktion und Einkaufsliste"
          - key: requirements
            label: "Gibt es bereits Anforderungen oder eine Aufgabenstellung?"
            placeholder: "z. B. muss als Webanwendung laufen, Daten in einer Datenbank speichern"
          - key: technologies
            label: "Welche Technologien oder Programmiersprachen sind festgelegt?"
            placeholder: "z. B. Java mit Spring Boot, React im Frontend"
          - key: currentState
            label: "Gibt es schon Programmcode oder eine bestehende Anwendung?"
            placeholder: "z. B. noch nichts vorhanden oder ein vorhandenes Projekt soll weiterentwickelt werden"

      WEB_OR_MOBILE_APP:
        questions:
          - key: usageScenario
            label: "Wer wird die App nutzen und wofür?"
            placeholder: "z. B. Studierende zur Lerngruppen-Koordination"
          - key: coreFeatures
            label: "Welche Funktionen soll die App haben?"
            placeholder: "z. B. Registrierung, Gruppenerstellung, Chat und Terminplanung"
          - key: technicalRequirements
            label: "Gibt es technische Vorgaben?"
            placeholder: "z. B. soll auf iPhone und Android laufen oder mit einem vorhandenen Server zusammenarbeiten"

      EXTEND_EXISTING_APPLICATION:
        questions:
          - key: currentState
            label: "Was kann die bestehende Anwendung aktuell?"
            placeholder: "z. B. eine Spring-Boot-App mit Benutzeranmeldung und Projektverwaltung"
          - key: desiredExtension
            label: "Was soll hinzugefügt oder geändert werden?"
            placeholder: "z. B. eine Export-Funktion für Berichte im PDF-Format"
          - key: affectedComponents
            label: "Welche Teile der Anwendung sind betroffen?"
            placeholder: "z. B. Backend-Service, Datenbank und eine neue Seite im Frontend"
          - key: technicalDependencies
            label: "Musst du vorhandene Technik oder bestimmte Vorgaben berücksichtigen?"
            placeholder: "z. B. eine vorhandene PDF-Funktion muss weiterverwendet werden"

      WEBSITE:
        questions:
          - key: goalAndAudience
            label: "Für wen ist die Website gedacht?"
            placeholder: "z. B. eine Portfolio-Website, um potenzielle Arbeitgeber anzusprechen"
          - key: pagesAndContent
            label: "Welche Seiten oder Inhalte soll die Website haben?"
            placeholder: "z. B. Startseite, Über mich, Projekte, Kontaktformular"
          - key: currentState
            label: "Gibt es bereits eine Website oder einen Entwurf?"
            placeholder: "z. B. noch nichts vorhanden, oder eine alte WordPress-Seite existiert"
          - key: designAndTechnicalRequirements
            label: "Hast du gestalterische oder technische Wünsche?"
            placeholder: "z. B. modernes Design, responsiv, eigene Domain vorhanden"

      DATABASE_PROJECT:
        questions:
          - key: purposeAndRequirements
            label: "Wofür wird die Datenbank benötigt?"
            placeholder: "z. B. Verwaltung von Kundendaten für ein Hochschulprojekt"
          - key: dataEntities
            label: "Welche Daten sollen gespeichert werden?"
            placeholder: "z. B. Kunden, Bestellungen, Produkte und Lieferanten"
          - key: technicalRequirements
            label: "Gibt es technische Vorgaben?"
            placeholder: "z. B. ein bestimmtes Datenbanksystem ist vorgegeben oder eine Skizze der Datenstruktur wird erwartet"
          - key: currentState
            label: "Gibt es schon eine vorhandene Datenbank oder einen Entwurf?"
            placeholder: "z. B. noch nichts vorhanden oder eine erste Skizze der Datenstruktur existiert"

      HARDWARE_OR_RASPBERRY_PI_PROJECT:
        questions:
          - key: useCase
            label: "Was soll das Projekt tun oder ermöglichen?"
            placeholder: "z. B. eine Wetterstation mit Raspberry Pi, die Temperatur und Luftfeuchtigkeit misst"
          - key: requiredComponents
            label: "Welche Bauteile hast du bereits oder werden benötigt?"
            placeholder: "z. B. Raspberry Pi 4, DHT22-Sensor, Breadboard und Kabel vorhanden"

      OTHER_SOFTWARE_AND_TECHNOLOGY:
        questions:
          - key: techGoal
            label: "Was soll das Ergebnis des Projekts sein?"
            placeholder: "z. B. ein technischer Prototyp, ein automatisiertes Skript oder eine andere technische Lösung"

  # =========================================================================
  # EVENT – Veranstaltung
  # =========================================================================
  EVENT:
    questions:
      - key: expectedParticipants
        label: "Wie viele Menschen sollen teilnehmen oder erreicht werden?"
        placeholder: "z. B. 30 Gäste, 8 Teams oder etwa 500 Personen bei einer Online-Aktion"

    subcategories:
      PRIVATE_CELEBRATION:
        questions:
          - key: occasion
            label: "Was wird gefeiert?"
            placeholder: "z. B. 30. Geburtstag, Hochzeit oder Einweihungsparty"
          - key: venue
            label: "Wo soll die Feier stattfinden?"
            placeholder: "z. B. zu Hause, in einem Restaurant oder an einem Ort, der noch gefunden werden muss"
          - key: budget
            label: "Hast du ein ungefähres Budget?"
            placeholder: "z. B. ca. 500 € für Essen, Deko und Getränke"

      WORKSHOP_TRAINING_OR_INFORMATION_EVENT:
        questions:
          - key: targetAudience
            label: "An wen richtet sich die Veranstaltung?"
            placeholder: "z. B. neue Mitarbeiter, Vereinsmitglieder oder interessierte Eltern"
          - key: learningGoal
            label: "Was sollen die Teilnehmer am Ende wissen oder können?"
            placeholder: "z. B. Grundlagen der Ersten Hilfe, Umgang mit einem neuen Tool"
          - key: topics
            label: "Welche Themen oder Inhalte werden behandelt?"
            placeholder: "z. B. Reanimation, stabile Seitenlage und Wundversorgung"
          - key: venueTechnology
            label: "Welcher Raum und welche Technik stehen zur Verfügung?"
            placeholder: "z. B. Seminarraum mit Beamer, Flipchart und WLAN"

      CLUB_OR_COMMUNITY_EVENT:
        questions:
          - key: eventType
            label: "Was für eine Veranstaltung planst du?"
            placeholder: "z. B. Sommerfest des Sportvereins, Tag der offenen Tür"
          - key: participants
            label: "Wer nimmt teil?"
            placeholder: "z. B. Vereinsmitglieder und ihre Familien"
          - key: venue
            label: "Wo soll die Veranstaltung stattfinden?"
            placeholder: "z. B. auf dem Vereinsgelände, im Gemeindehaus"
          - key: permits
            label: "Gibt es organisatorische Vorgaben oder Genehmigungen?"
            placeholder: "z. B. Genehmigung der Gemeinde nötig, Ausschankerlaubnis"

      CONCERT_OR_PERFORMANCE:
        questions:
          - key: program
            label: "Was wird aufgeführt oder gespielt?"
            placeholder: "z. B. Schultheater-Aufführung, Bandkonzert, Chorauftritt"
          - key: contributors
            label: "Wer wirkt mit?"
            placeholder: "z. B. 12 Schauspieler, 5 Bandmitglieder, Techniker"
          - key: currentProgress
            label: "Wie weit sind die Vorbereitungen?"
            placeholder: "z. B. Stück ist gewählt, Proben beginnen nächste Woche"
          - key: venueTechnology
            label: "Welcher Raum und welche Technik stehen zur Verfügung?"
            placeholder: "z. B. Aula mit Bühne, Lautsprechern und Mikrofonen"

      FLEA_MARKET_OR_SALES_EVENT:
        questions:
          - key: typeAndScope
            label: "Was für ein Verkauf ist geplant?"
            placeholder: "z. B. Flohmarktstand auf dem Wochenmarkt, Kuchenverkauf beim Schulfest"
          - key: goods
            label: "Was soll verkauft werden?"
            placeholder: "z. B. Kleidung, Bücher und Spielzeug oder selbstgebackene Kuchen"
          - key: venue
            label: "Wo findet der Verkauf statt?"
            placeholder: "z. B. eigener Stand auf dem Stadtflohmarkt, Tisch im Schulfoyer"

      FUNDRAISING_EVENT:
        questions:
          - key: fundraisingGoal
            label: "Wofür werden die Spenden gesammelt?"
            placeholder: "z. B. neue Trikots für die Jugendmannschaft, Schulprojekt in Kenia"
          - key: targetAudience
            label: "Wen möchtest du ansprechen?"
            placeholder: "z. B. Nachbarschaft, Eltern der Schüler, lokale Unternehmen"
          - key: campaignFormat
            label: "In welcher Form soll die Aktion stattfinden?"
            placeholder: "z. B. Spendenlauf, Online-Crowdfunding oder Benefizkonzert"
          - key: organizationalRequirements
            label: "Gibt es organisatorische Vorgaben?"
            placeholder: "z. B. Gemeinnützigkeit erforderlich, Spendenquittungen ausstellen"

      TOURNAMENT_OR_COMPETITION:
        questions:
          - key: competitionType
            label: "Was für ein Wettbewerb oder Turnier wird organisiert?"
            placeholder: "z. B. Fußballturnier, Schachmeisterschaft, Quiz-Abend"
          - key: rules
            label: "Welche Regeln oder welcher Modus soll gelten?"
            placeholder: "z. B. Gruppenphase mit anschließendem K.-o.-System"
          - key: venueEquipment
            label: "Welcher Ort und welche Ausstattung stehen zur Verfügung?"
            placeholder: "z. B. Sporthalle mit zwei Feldern, Schiedsrichter vorhanden"

      STUDY_EVENT:
        questions:
          - key: eventGoalFormat
            label: "Was ist das Ziel und Format der Veranstaltung?"
            placeholder: "z. B. studentisches Symposium mit Vorträgen und Poster-Session"
          - key: audienceSize
            label: "Wer soll teilnehmen?"
            placeholder: "z. B. Studierende, Dozierende oder externes Fachpublikum"
          - key: venueTechnology
            label: "Welcher Ort und welche Technik stehen zur Verfügung?"
            placeholder: "z. B. Hörsaal der Universität mit Beamer und Mikrofon"

      OTHER_EVENT:
        questions:
          - key: eventGoal
            label: "Was ist der Anlass oder das Ziel der Veranstaltung?"
            placeholder: "z. B. ein Treffen, eine Informationsveranstaltung oder ein anderes Veranstaltungsformat"

  # =========================================================================
  # HOME – Haushalt und Wohnen
  # =========================================================================
  HOME:
    subcategories:
      MOVING:
        questions:
          - key: movingSituation
            label: "Wohin ziehst du und wie weit ist der Umzug?"
            placeholder: "z. B. von einer 50-m²-Wohnung in eine 70-m²-Wohnung in derselben Stadt"
          - key: householdScope
            label: "Wie viel Hausrat muss umgezogen werden?"
            placeholder: "z. B. komplette Einrichtung mit Waschmaschine und großem Kleiderschrank"
          - key: externalHelp
            label: "Planst du ein Umzugsunternehmen oder helfen Freunde?"
            placeholder: "z. B. drei Freunde helfen am Umzugstag, kein Unternehmen"
          - key: transportOptions
            label: "Welche Transportmöglichkeiten stehen zur Verfügung?"
            placeholder: "z. B. zwei Autos, ein Transporter wird noch gemietet"

      RENOVATION_OR_HOME_PROJECT:
        questions:
          - key: affectedRooms
            label: "Welche Räume oder Flächen sind betroffen?"
            placeholder: "z. B. Badezimmer, Wohnzimmer oder der Flur"
          - key: plannedWork
            label: "Was genau soll gemacht werden?"
            placeholder: "z. B. Wände streichen, neuen Boden verlegen, Fliesen erneuern"
          - key: executionMode
            label: "Machst du es selbst oder beauftragst du Handwerker?"
            placeholder: "z. B. Streichen selbst, Fliesen vom Fliesenleger"
          - key: budgetMaterials
            label: "Welches Budget und welche Materialien stehen zur Verfügung?"
            placeholder: "z. B. ca. 2.000 €, Farbe ist schon gekauft"

      DECLUTTERING_OR_HOUSEHOLD_ORGANIZATION:
        questions:
          - key: affectedAreas
            label: "Welche Bereiche möchtest du ausmisten oder besser organisieren?"
            placeholder: "z. B. Keller, Kleiderschrank, Küche oder die gesamte Wohnung"
          - key: scope
            label: "Wie umfangreich ist das Vorhaben?"
            placeholder: "z. B. ein Wochenende für den Keller, mehrere Wochen für die ganze Wohnung"
          - key: disposalOptions
            label: "Was passiert mit den aussortierten Dingen?"
            placeholder: "z. B. Sperrmüll, Flohmarkt, Spende an Sozialkaufhaus"
          - key: sortingCriteria
            label: "Was soll auf jeden Fall behalten oder aussortiert werden?"
            placeholder: "z. B. alle Bücher behalten, Kleidung, die seit einem Jahr nicht getragen wurde, aussortieren"

      GARDEN_PROJECT:
        questions:
          - key: gardenGoal
            label: "Was möchtest du im Garten verändern oder anlegen?"
            placeholder: "z. B. ein Gemüsebeet anlegen, die Terrasse neu gestalten"
          - key: gardenScope
            label: "Wie groß ist die Fläche oder der Bereich?"
            placeholder: "z. B. ca. 20 m² Beet, kleiner Balkon oder ganzer Vorgarten"
          - key: materialsPlants
            label: "Welche Materialien oder Pflanzen hast du bereits?"
            placeholder: "z. B. Erde und Samen vorhanden, Werkzeug muss noch besorgt werden"
          - key: seasonalConstraints
            label: "Gibt es saisonale Einschränkungen?"
            placeholder: "z. B. Aussaat muss bis April erfolgen, Projekt im Herbst geplant"

      OTHER_HOME:
        questions:
          - key: homeGoal
            label: "Was möchtest du in deinem Zuhause verändern oder erreichen?"
            placeholder: "z. B. einen Bereich neu gestalten oder den Haushalt anders organisieren"

  # =========================================================================
  # CREATIVE – Kreatives
  # =========================================================================
  CREATIVE:
    subcategories:
      WRITING_PROJECT:
        questions:
          - key: typeGenre
            label: "Was für ein Schreibprojekt ist es?"
            placeholder: "z. B. ein Fantasy-Roman, eine Kurzgeschichtensammlung oder ein Sachbuch"
          - key: desiredOutcome
            label: "Was soll am Ende herauskommen?"
            placeholder: "z. B. fertiges Manuskript, veröffentlichtes E-Book oder Blogartikel-Serie"
          - key: scope
            label: "Wie umfangreich soll das Ergebnis werden?"
            placeholder: "z. B. ca. 200 Seiten, 10 Kurzgeschichten oder 20 Blogartikel"
          - key: targetAudience
            label: "An wen richtet sich das Werk?"
            placeholder: "z. B. junge Erwachsene, Fachpublikum oder eigener Blog"
          - key: currentProgress
            label: "Wie weit bist du bisher?"
            placeholder: "z. B. Idee und Grobstruktur stehen, erste Kapitel geschrieben"

      PODCAST:
        questions:
          - key: topicAudience
            label: "Worum geht es und an wen richtet sich der Podcast?"
            placeholder: "z. B. True-Crime-Podcast für junge Erwachsene"
          - key: format
            label: "Wie soll der Podcast aufgebaut sein?"
            placeholder: "z. B. Interview, Gesprächsrunde, Erzählformat oder Solo-Folge"
          - key: scope
            label: "Wie viele Folgen oder wie lang soll der Podcast werden?"
            placeholder: "z. B. 10 Folgen à 30 Minuten"
          - key: availableTechnology
            label: "Welche Aufnahmetechnik hast du?"
            placeholder: "z. B. USB-Mikrofon und Laptop vorhanden, Schnittsoftware fehlt"
          - key: currentProgress
            label: "Wie weit bist du bisher?"
            placeholder: "z. B. Konzept steht, Intro-Musik fehlt noch"

      VIDEO_OR_SHORT_FILM_PROJECT:
        questions:
          - key: ideaGoal
            label: "Worum geht es in dem Video oder Film?"
            placeholder: "z. B. Dokumentarfilm über lokale Imker, YouTube-Tutorial-Serie"
          - key: contributors
            label: "Wer ist an der Produktion beteiligt?"
            placeholder: "z. B. zwei Freunde als Darsteller, ich mache Kamera und Schnitt"
          - key: scope
            label: "Wie lang oder umfangreich soll das Ergebnis werden?"
            placeholder: "z. B. ca. 15 Minuten, 5 kurze Clips für Social Media"
          - key: availableTechnology
            label: "Welche Ausrüstung steht zur Verfügung?"
            placeholder: "z. B. Smartphone mit guter Kamera, Stativ und ein Ringlicht"
          - key: currentProgress
            label: "Wie weit bist du bisher?"
            placeholder: "z. B. Idee vorhanden, Drehbuch muss noch geschrieben werden"

      PHOTO_OR_GRAPHIC_PROJECT:
        questions:
          - key: goalStyle
            label: "Was möchtest du fotografisch oder grafisch umsetzen?"
            placeholder: "z. B. Portraitserie, Produktfotos für einen Onlineshop, Poster-Design"
          - key: subjects
            label: "Was soll abgebildet oder gestaltet werden?"
            placeholder: "z. B. Personen, Landschaften, Logos oder Social-Media-Grafiken"
          - key: scope
            label: "Wie umfangreich ist das Projekt?"
            placeholder: "z. B. 20 bearbeitete Fotos, 5 Designvorlagen"
          - key: availableResources
            label: "Welche Technik oder Materialien hast du?"
            placeholder: "z. B. Spiegelreflexkamera vorhanden, Photoshop-Lizenz aktiv"

      MUSIC_PROJECT:
        questions:
          - key: musicType
            label: "Was für ein Musikprojekt ist es?"
            placeholder: "z. B. eigenes Album aufnehmen, Stück für Schulchor arrangieren"
          - key: desiredOutcome
            label: "Was soll am Ende entstehen?"
            placeholder: "z. B. fertig produzierte EP mit 5 Songs, Notenblätter für das Ensemble"
          - key: contributors
            label: "Wer arbeitet mit?"
            placeholder: "z. B. drei Bandmitglieder und ein Tontechniker"
          - key: currentProgress
            label: "Wie weit bist du bisher?"
            placeholder: "z. B. Songs sind geschrieben, Aufnahmen stehen noch aus"
          - key: availableTechnology
            label: "Welche Technik steht zur Verfügung?"
            placeholder: "z. B. Home-Studio mit Mikrofon, Audio-Interface und Aufnahmeprogramm"

      EXHIBITION:
        questions:
          - key: goalAudience
            label: "Was ist das Thema und wer soll die Ausstellung besuchen?"
            placeholder: "z. B. Fotoausstellung zum Thema Stadtleben für die Öffentlichkeit"
          - key: exhibits
            label: "Was soll ausgestellt werden?"
            placeholder: "z. B. 30 gerahmte Fotos, 5 Skulpturen und interaktive Stationen"
          - key: venue
            label: "Wo soll die Ausstellung stattfinden?"
            placeholder: "z. B. Galerie in der Innenstadt, Gemeindehaus oder Uni-Foyer"
          - key: currentProgress
            label: "Wie weit sind die Vorbereitungen?"
            placeholder: "z. B. Werke sind fertig, Ort muss noch organisiert werden"

      BLOG_OR_SOCIAL_MEDIA_CAMPAIGN:
        questions:
          - key: goalAudience
            label: "Was soll erreicht werden und wen möchtest du ansprechen?"
            placeholder: "z. B. mehr Reichweite für einen Reiseblog, Follower für einen neuen Kanal"
          - key: channels
            label: "Welche Kanäle oder Plattformen möchtest du nutzen?"
            placeholder: "z. B. Instagram und Blog, TikTok und YouTube"
          - key: contentScope
            label: "Wie viele Beiträge oder welche Inhalte sind geplant?"
            placeholder: "z. B. 3 Beiträge pro Woche über 2 Monate"
          - key: currentProgress
            label: "Wie weit bist du bisher?"
            placeholder: "z. B. Kanal existiert schon, ein Plan für die Beiträge fehlt noch"

      BOARD_GAME_OR_CREATIVE_PROTOTYPE:
        questions:
          - key: ideaGoal
            label: "Was für ein Spiel oder Prototyp soll entstehen?"
            placeholder: "z. B. ein kooperatives Brettspiel für 2–4 Spieler, ein Kartenspiel-Prototyp"
          - key: targetAudience
            label: "Für wen ist es gedacht?"
            placeholder: "z. B. Familien mit Kindern ab 8 Jahren"
          - key: prototypeScope
            label: "Wie weit soll der Prototyp reichen?"
            placeholder: "z. B. spielbarer Prototyp mit allen Grundmechaniken"
          - key: currentProgress
            label: "Wie weit bist du bisher?"
