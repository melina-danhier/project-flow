<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Meilenstein – ProjectFlow</title></head>
<body><main>
<a th:href="@{/projects/{id}(id=${milestone.planContainerId})}">Zum Projektplan</a>
<h1 th:text="${milestone.title}">Meilenstein</h1><p th:text="${milestone.description}"></p>
<form th:if="${milestone.editable}" th:action="@{/projects/{projectId}/milestones/{milestoneId}/edit(projectId=${milestone.planContainerId},milestoneId=${milestone.id})}" th:object="${milestoneForm}" method="post">
    <input type="hidden" th:field="*{lockVersion}"><input type="hidden" th:field="*{sortOrder}">
    <label for="title">Titel</label><input id="title" th:field="*{title}" required maxlength="100">
    <label for="description">Beschreibung</label><textarea id="description" th:field="*{description}" maxlength="2000"></textarea>
    <label for="section">Phase</label><select id="section" th:field="*{planSectionId}"><option value="">Ohne Phase</option><option th:each="section : ${milestone.availableSections}" th:value="${section.id}" th:text="${section.title}"></option></select>
    <label for="dueDate">Fällig am</label><input id="dueDate" type="date" th:field="*{dueDate}">
    <label for="completed">Erledigt</label><input id="completed" type="checkbox" th:field="*{completed}">
    <button type="submit">Meilenstein speichern</button>
</form>
<form th:if="${milestone.editable}" th:action="@{/projects/{projectId}/milestones/{milestoneId}/delete(projectId=${milestone.planContainerId},milestoneId=${milestone.id})}" method="post">
    <button type="submit">Meilenstein endgültig löschen</button>
</form>
</main></body></html>
