<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head('Erstellungsmethode wählen')}" />
    <link rel="stylesheet" th:href="@{/css/components/wizard.css}">
    <script th:src="@{/js/wizard.js}" defer></script>
</head>
<body>
<th:block th:replace="~{fragments/layout :: site-header}" />

<main class="pf-wizard-container">
    <div class="pf-page-header pf-wizard-header">
        <div class="pf-page-header__left">
            <h1 style="margin: 0;">Projekt erstellen</h1>
            <p class="pf-page-header__subtitle">
                Die Grundangaben für „<strong th:text="${wizardState.title}">Projekt</strong>" sind gespeichert. Wähle nun die gewünschte Erstellungsmethode.
            </p>
        </div>
    </div>

    <div class="pf-wizard-card">
        <div th:if="${wizardState.selectedTemplateId != null}" class="pf-alert pf-alert--info" style="margin-bottom:1.25rem">
            Deine zuvor ausgewählte Vorlage ist gespeichert. Mit „Aus Vorlage“ gelangst du direkt zur Bestätigung.
        </div>
        <form th:action="@{/projects/new/method}" th:object="${creationMethodForm}" method="post">
            <fieldset style="border: none; padding: 0; margin: 0;">
                <legend style="padding: 0; font-size: 1.05rem; font-weight: 700; margin-bottom: 0.5rem;">Erstellungsmethode</legend>
                
                <div class="pf-creation-methods-grid" role="radiogroup" aria-label="Erstellungsmethode auswählen">
                    <!-- Option 1: AI -->
                    <label class="pf-method-card" th:classappend="*{creationType != null and creationType.name() == 'AI' ? 'is-selected' : ''}">
                        <div>
                            <div class="pf-method-card__top">
                                <span class="pf-badge pf-badge--purple">Smart AI</span>
                                <input type="radio" th:field="*{creationType}" value="AI">
                            </div>
                            <h3 class="pf-method-card__title">KI-generierter Plan</h3>
                            <p class="pf-method-card__desc">
                                Automatisch vorgeschlagene Phasen, Aufgaben und Meilensteine auf Basis deiner Angaben.
                            </p>
                        </div>
                    </label>

                    <!-- Option 2: Template -->
                    <label class="pf-method-card" th:classappend="*{creationType != null and creationType.name() == 'TEMPLATE' ? 'is-selected' : ''}">
                        <div>
                            <div class="pf-method-card__top">
                                <span class="pf-badge pf-badge--blue">Vorlagen</span>
                                <input type="radio" th:field="*{creationType}" value="TEMPLATE">
                            </div>
                            <h3 class="pf-method-card__title">Aus Vorlage</h3>
                            <p class="pf-method-card__desc">
                                Erprobte Strukturen und Zeitpläne aus fertigen Projektvorlagen übernehmen.
                            </p>
                        </div>
                    </label>

                    <!-- Option 3: Manual / Empty -->
                    <label class="pf-method-card" th:classappend="*{creationType != null and creationType.name() == 'EMPTY' ? 'is-selected' : ''}">
                        <div>
                            <div class="pf-method-card__top">
                                <span class="pf-badge pf-badge--gray">Flexibel</span>
                                <input type="radio" th:field="*{creationType}" value="EMPTY">
                            </div>
                            <h3 class="pf-method-card__title">Leeres Projekt</h3>
                            <p class="pf-method-card__desc">
                                Mit einem leeren Plan starten und Bereiche sowie Aufgaben ganz frei selbst anlegen.
                            </p>
                        </div>
                    </label>
                </div>
            </fieldset>

            <div th:if="${#fields.hasErrors('creationType')}" th:errors="*{creationType}" class="pf-alert pf-alert--error" role="alert"></div>

            <div class="pf-wizard-footer">
                <div class="pf-wizard-footer__left">
                    <a th:href="@{/projects/new}" class="pf-btn pf-btn--secondary">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                        </svg>
                        <span>Grundangaben bearbeiten</span>
                    </a>
                    <button type="submit" form="wizard-cancel-form" class="pf-btn pf-btn--ghost" style="color: var(--pf-text-muted);"
                            data-confirm="Möchtest du die Projekterstellung wirklich abbrechen? Alle bisherigen Eingaben werden gelöscht."
                            data-confirm-title="Projekterstellung abbrechen?"
                            data-confirm-btn="Erstellung abbrechen"
                            data-confirm-variant="danger">
                        Erstellung abbrechen
                    </button>
                </div>
                <button id="method-submit" type="submit" class="pf-btn pf-btn--primary">
                    Weiter
                </button>
            </div>
        </form>

        <form id="wizard-cancel-form" th:action="@{/projects/new/cancel}" method="post"
              style="display: none;"></form>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: site-footer}" />
</body>
</html>
