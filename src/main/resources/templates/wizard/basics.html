<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><title>Projekt anlegen – ProjectFlow</title></head>
<body><main>
<p>Schritt 1 von 2</p>
<h1>Grundangaben zum Projekt</h1>
<p>Diese Angaben gelten unabhängig davon, wie du dein Projekt anschließend erstellst.</p>
<form th:action="@{/projects/new}" th:object="${projectBasicsForm}" method="post">
    <label for="title">Projekttitel</label>
    <input id="title" th:field="*{title}" required maxlength="100">
    <p th:if="${#fields.hasErrors('title')}" th:errors="*{title}" role="alert"></p>
    <label for="description">Ziel oder kurze Beschreibung <span>(optional)</span></label>
    <textarea id="description" th:field="*{description}" maxlength="2000"></textarea>
    <p th:if="${#fields.hasErrors('description')}" th:errors="*{description}" role="alert"></p>
    <div th:replace="~{fragments/project-classification :: fields}"></div>
    <fieldset>
        <legend>Wer arbeitet am Projekt?</legend>
        <label><input type="radio" th:field="*{collaborationMode}" value="INDIVIDUAL" required> Nur ich</label>
        <label><input type="radio" th:field="*{collaborationMode}" value="GROUP"> Eine kleine Gruppe</label>
    </fieldset>
    <p th:if="${#fields.hasErrors('collaborationMode')}" th:errors="*{collaborationMode}" role="alert"></p>
    <fieldset>
        <legend>Zeitlicher Rahmen</legend>
        <label><input type="radio" th:field="*{timeFrameType}" value="START_AND_END"> Start und Ende</label>
        <label><input type="radio" th:field="*{timeFrameType}" value="START_AND_DURATION"> Start und Dauer</label>
        <label><input type="radio" th:field="*{timeFrameType}" value="END_AND_DURATION"> Ende und Dauer</label>
        <label><input type="radio" th:field="*{timeFrameType}" value="NONE"> Noch keine Zeitangaben</label>
    </fieldset>
    <p th:if="${#fields.hasErrors('timeFrameType')}" th:errors="*{timeFrameType}" role="alert"></p>
    <div id="start-date-field" th:hidden="*{!startDateInputActive}">
        <label for="startDate">Startdatum</label>
        <input id="startDate" type="date" th:field="*{startDate}"
               th:disabled="*{!startDateInputActive}" th:required="*{startDateInputActive}">
        <p th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}" role="alert"></p>
    </div>
    <div id="end-date-field" th:hidden="*{!endDateInputActive}">
        <label for="endDate">Enddatum</label>
        <input id="endDate" type="date" th:field="*{endDate}"
               th:disabled="*{!endDateInputActive}" th:required="*{endDateInputActive}">
        <p th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}" role="alert"></p>
    </div>
    <div id="duration-field" th:hidden="*{!durationInputActive}">
        <label for="durationDays">Dauer in Tagen</label>
        <input id="durationDays" type="number" min="1" step="1" th:field="*{durationDays}"
               th:disabled="*{!durationInputActive}" th:required="*{durationInputActive}">
        <p th:if="${#fields.hasErrors('durationDays')}" th:errors="*{durationDays}" role="alert"></p>
    </div>
    <button type="submit">Weiter</button>
</form>
<form th:action="@{/projects/new/cancel}" method="post"><button type="submit">Abbrechen</button></form>
<script>
    (() => {
        const startField = document.getElementById('start-date-field');
        const startInput = document.getElementById('startDate');
        const endField = document.getElementById('end-date-field');
        const endInput = document.getElementById('endDate');
        const durationField = document.getElementById('duration-field');
        const durationInput = document.getElementById('durationDays');
        const updateTimeFields = () => {
            const selected = document.querySelector('input[name="timeFrameType"]:checked')?.value ?? 'NONE';
            const needsStart = selected === 'START_AND_END' || selected === 'START_AND_DURATION';
            const needsEnd = selected === 'START_AND_END' || selected === 'END_AND_DURATION';
            const needsDuration = selected === 'START_AND_DURATION' || selected === 'END_AND_DURATION';
            startField.hidden = !needsStart;
            startInput.disabled = !needsStart;
            startInput.required = needsStart;
            endField.hidden = !needsEnd;
            endInput.disabled = !needsEnd;
            endInput.required = needsEnd;
            durationField.hidden = !needsDuration;
            durationInput.disabled = !needsDuration;
            durationInput.required = needsDuration;
        };
        document.querySelectorAll('input[name="timeFrameType"]')
            .forEach(input => input.addEventListener('change', updateTimeFields));
        updateTimeFields();
    })();
</script>
</main></body></html>
