<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head('Projekt anlegen')}" />
</head>
<body>
<th:block th:replace="~{fragments/layout :: site-header}" />

<main>
    <div class="pf-page-header">
        <div class="pf-page-header__left">
            <div class="pf-cluster" style="margin-bottom: 0.25rem;">
                <span class="pf-badge pf-badge--purple">Schritt 1 von 2</span>
                <span class="pf-badge pf-badge--gray">Projekt-Assistent</span>
            </div>
            <h1 style="margin: 0;">Grundangaben zum Projekt</h1>
            <p class="pf-page-header__subtitle">Diese Basisdaten gelten unabhängig davon, wie du dein Projekt im nächsten Schritt erstellst.</p>
        </div>
    </div>

    <div class="pf-card" style="max-width: 760px;">
        <form th:action="@{/projects/new}" th:object="${projectBasicsForm}" method="post">
            <th:block th:replace="~{fragments/form-fields :: title-field('Projekttitel')}" />
            <th:block th:replace="~{fragments/form-fields :: description-field('Ziel oder kurze Beschreibung', true)}" />
            <div th:replace="~{fragments/project-classification :: fields}"></div>
            <th:block th:replace="~{fragments/form-fields :: collaboration-mode}" />
            
            <fieldset>
                <legend>Zeitlicher Rahmen</legend>
                <div style="display: flex; flex-wrap: wrap; gap: 0.75rem 1.5rem; margin-top: 0.5rem;">
                    <label><input type="radio" th:field="*{timeFrameType}" value="START_AND_END"> <span>Start und Ende</span></label>
                    <label><input type="radio" th:field="*{timeFrameType}" value="START_AND_DURATION"> <span>Start und Dauer</span></label>
                    <label><input type="radio" th:field="*{timeFrameType}" value="END_AND_DURATION"> <span>Ende und Dauer</span></label>
                    <label><input type="radio" th:field="*{timeFrameType}" value="NONE"> <span>Noch keine Zeitangaben</span></label>
                </div>
            </fieldset>
            
            <div th:if="${#fields.hasErrors('timeFrameType')}" th:errors="*{timeFrameType}" class="pf-alert pf-alert--error" role="alert"></div>

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem;">
                <div id="start-date-field" th:hidden="*{!startDateInputActive}" class="pf-form-group">
                    <label for="startDate" class="pf-label">Startdatum</label>
                    <input id="startDate" type="date" th:field="*{startDate}" class="pf-input"
                           th:disabled="*{!startDateInputActive}" th:required="*{startDateInputActive}">
                    <div th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}" class="pf-alert pf-alert--error" role="alert"></div>
                </div>

                <div id="end-date-field" th:hidden="*{!endDateInputActive}" class="pf-form-group">
                    <label for="endDate" class="pf-label">Enddatum</label>
                    <input id="endDate" type="date" th:field="*{endDate}" class="pf-input"
                           th:disabled="*{!endDateInputActive}" th:required="*{endDateInputActive}">
                    <div th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}" class="pf-alert pf-alert--error" role="alert"></div>
                </div>

                <div id="duration-field" th:hidden="*{!durationInputActive}" class="pf-form-group">
                    <label for="durationDays" class="pf-label">Dauer in Tagen</label>
                    <input id="durationDays" type="number" min="1" step="1" th:field="*{durationDays}" class="pf-input"
                           th:disabled="*{!durationInputActive}" th:required="*{durationInputActive}">
                    <div th:if="${#fields.hasErrors('durationDays')}" th:errors="*{durationDays}" class="pf-alert pf-alert--error" role="alert"></div>
                </div>
            </div>

            <div style="margin-top: 1.75rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem;">
                <button type="submit" class="pf-btn pf-btn--primary">
                    Weiter zum nächsten Schritt →
                </button>
            </div>
        </form>

        <div style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--pf-border);">
            <th:block th:replace="~{fragments/wizard-nav :: cancel('Assistent abbrechen')}" />
        </div>
    </div>

    <script>
        (() => {
            const startField = document.getElementById('start-date-field');
            const startInput = document.getElementById('startDate');
            const endField = document.getElementById('end-date-field');
            const endInput = document.getElementById('endDate');
            const durationField = document.getElementById('duration-field');
            const durationInput = document.getElementById('durationDays');
            const updateTimeFields = () => {
                const selected = document.querySelector('input[name="timeFrameType"]:checked')?.value ?? 'NONE';
                const needsStart = selected === 'START_AND_END' || selected === 'START_AND_DURATION';
                const needsEnd = selected === 'START_AND_END' || selected === 'END_AND_DURATION';
                const needsDuration = selected === 'START_AND_DURATION' || selected === 'END_AND_DURATION';
                startField.hidden = !needsStart;
                startInput.disabled = !needsStart;
                startInput.required = needsStart;
                endField.hidden = !needsEnd;
                endInput.disabled = !needsEnd;
                endInput.required = needsEnd;
                durationField.hidden = !needsDuration;
                durationInput.disabled = !needsDuration;
                durationInput.required = needsDuration;
            };
            document.querySelectorAll('input[name="timeFrameType"]')
                .forEach(input => input.addEventListener('change', updateTimeFields));
            updateTimeFields();
        })();
    </script>
</main>

<th:block th:replace="~{fragments/layout :: site-footer}" />
</body>
</html>
