<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><title>Vorlage ansehen – ProjectFlow</title></head>
<body><main>
<h1 th:text="${template.title}">Vorlage</h1><p th:text="${template.description}"></p>
<p th:if="${template.projectTypeLabel}" th:text="${template.projectTypeLabel}"></p>
<h2>Bereiche</h2><ul><li th:each="section : ${template.sections}" th:text="${section.title}"></li></ul>
<h2>Aufgaben</h2><ul><li th:each="task : ${template.tasks}" th:text="${task.title}"></li></ul>
<a th:href="@{/projects/new/template}">Zurück zum Katalog</a>
<form th:action="@{/projects/new/template/{id}(id=${template.id})}" method="post">
    <button type="submit">Vorlage benutzen</button>
</form>
</main></body></html>
