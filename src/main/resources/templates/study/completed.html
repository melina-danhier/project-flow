<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head('Aufgaben abgeschlossen')}" />
</head>
<body>
<th:block th:replace="~{fragments/layout :: site-header}" />

<main class="pf-page-shell" style="max-width: 680px; margin: 3rem auto; padding: 0 1rem;">
    <section class="pf-card" style="text-align: center; padding: 2.5rem 2rem;">
        <div class="pf-confirm-icon-wrap pf-confirm-icon-wrap--primary" style="margin: 0 auto 1.25rem; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #eff6ff; color: var(--pf-primary, #2563eb);">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>
        <p class="pf-eyebrow" style="color: var(--pf-primary, #2563eb); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.85rem; margin-bottom: 0.5rem;">Nutzerstudie</p>
        <h1 style="margin-top: 0; margin-bottom: 1rem; font-size: 1.75rem;">Aufgaben abgeschlossen</h1>
        <p style="font-size: 1.05rem; line-height: 1.6; color: var(--pf-text-secondary, #475569); margin-bottom: 2rem;">
            Die Aufgaben in ProjectFlow sind abgeschlossen. Im nächsten Schritt wirst du zu einem anonymen Fragebogen weitergeleitet. Dort kannst du deine Erfahrungen mit ProjectFlow und der KI-Unterstützung bewerten.
        </p>

        <form th:action="@{/study/finish}" method="post" style="margin: 0; display: inline-block;">
            <button class="pf-btn pf-btn--primary pf-btn--lg" type="submit" style="padding: 0.75rem 2rem; font-size: 1.05rem;">
                Zum Fragebogen
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-left: 0.5rem; vertical-align: middle;">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </form>
    </section>
</main>

<th:block th:replace="~{fragments/layout :: site-footer}" />
</body>
</html>
