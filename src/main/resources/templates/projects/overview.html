<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Projekte – ProjectFlow</title>
</head>
<body>
<main>
    <h1>Meine Projekte</h1>
    <nav aria-label="Projektbereiche">
        <a th:href="@{/projects}">Aktiv</a>
        <a th:href="@{/projects/drafts}">Entwürfe</a>
        <a th:href="@{/projects(location=ARCHIVE)}">Archiv</a>
        <a th:href="@{/projects(location=TRASH)}">Papierkorb</a>
    </nav>
    <p th:if="${successMessage}" th:text="${successMessage}" role="status"></p>
    <p th:if="${#lists.isEmpty(projects)}">In diesem Bereich sind keine Projekte vorhanden.</p>
    <ul th:unless="${#lists.isEmpty(projects)}">
        <li th:each="project : ${projects}">
            <a th:if="${selectedLocation.name() != 'DRAFT'}" th:href="@{/projects/{id}/plan(id=${project.id})}" th:text="${project.title}"></a>
            <a th:if="${selectedLocation.name() == 'DRAFT'}"
               th:href="@{/projects/{id}/draft(id=${project.id})}" th:text="${project.title}"></a>
            <span th:if="${project.projectTypeLabel}" th:text="${project.projectTypeLabel}"></span>
        </li>
    </ul>
    <a th:href="@{/projects/new}">Projekt anlegen</a>
    <a th:href="@{/templates}">Vorlagen ansehen</a>
    <form th:action="@{/logout}" method="post">
        <button type="submit">Abmelden</button>
    </form>
</main>
</body>
</html>
