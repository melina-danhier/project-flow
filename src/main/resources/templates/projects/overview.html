<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Projekte – ProjectFlow</title>
</head>
<body>
<main>
    <h1>Meine Projekte</h1>
    <p th:if="${#lists.isEmpty(projects)}">Du hast derzeit keine aktiven Projekte.</p>
    <ul th:unless="${#lists.isEmpty(projects)}">
        <li th:each="project : ${projects}" th:text="${project.title}"></li>
    </ul>
    <form th:action="@{/logout}" method="post">
        <button type="submit">Abmelden</button>
    </form>
</main>
</body>
</html>
