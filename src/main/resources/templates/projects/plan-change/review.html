<!DOCTYPE html><html lang="de" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('KI-Änderung prüfen')}"></head><body>
<header th:replace="~{fragments/layout :: site-header}"></header><main class="pf-page pf-page--narrow">
<a th:href="@{/projects/{id}/plan(id=${proposal.projectId})}" class="pf-back-link">← Zurück zum aktiven Plan</a><div class="pf-card"><span class="pf-badge pf-badge--warning">Temporärer Vorschlag</span><h1>KI-Änderungen prüfen</h1><p th:text="${review.summary}"></p><p class="pf-text-muted">Es werden ausschließlich betroffene Bereiche und tatsächlich vorgeschlagene Felder angezeigt. Die aktiven Plandaten sind noch unverändert.</p><div th:if="${errorMessage}" class="pf-alert pf-alert--error" role="alert" th:text="${errorMessage}"></div></div>
<section th:each="section : ${review.sections}" class="pf-card" style="margin-top:1rem"><div class="pf-cluster"><h2 th:text="${section.title}"></h2><span th:if="${section.sectionChanged}" class="pf-badge" th:classappend="${section.operation.name() == 'NEW' ? 'pf-badge--blue' : 'pf-badge--warning'}" th:text="${section.operation.name() == 'NEW' ? 'Neu' : 'Geändert'}"></span></div>
<dl th:if="${section.sectionChanged}"><div th:each="field : ${section.fields}" style="margin-bottom:.75rem"><dt th:text="${field.label}"></dt><dd><span th:if="${field.before != null}" th:text="${field.before}"></span><span th:if="${field.before != null}"> → </span><strong th:text="${field.after}"></strong></dd></div></dl>
<article th:each="element : ${section.elements}" style="border-top:1px solid var(--pf-border);padding-top:1rem;margin-top:1rem"><div class="pf-cluster"><span class="pf-badge pf-badge--outline" th:text="${element.typeLabel}"></span><span class="pf-badge" th:classappend="${element.operation.name() == 'NEW' ? 'pf-badge--blue' : 'pf-badge--warning'}" th:text="${element.operation.name() == 'NEW' ? 'Neu' : 'Geändert'}"></span></div><h3 th:text="${element.title}"></h3>
<dl><div th:each="field : ${element.fields}" style="margin-bottom:.75rem"><dt th:text="${field.label}"></dt><dd><span th:if="${field.before != null}" th:text="${field.before}"></span><span th:if="${field.before != null}"> → </span><strong th:text="${field.after}"></strong></dd></div></dl><p th:if="${element.explanation}" class="pf-text-muted" th:text="${element.explanation}"></p></article></section>
<div class="pf-cluster" style="margin-top:1.5rem"><form th:action="@{/projects/{projectId}/plan/ai-change/{proposalId}/confirm(projectId=${proposal.projectId},proposalId=${proposal.proposalId})}" method="post"><button type="submit" class="pf-btn pf-btn--primary">Änderungen übernehmen</button></form><form th:action="@{/projects/{projectId}/plan/ai-change/{proposalId}/discard(projectId=${proposal.projectId},proposalId=${proposal.proposalId})}" method="post"><button type="submit" class="pf-btn pf-btn--danger">Verwerfen</button></form><form th:action="@{/projects/{projectId}/plan/ai-change/{proposalId}/regenerate(projectId=${proposal.projectId},proposalId=${proposal.proposalId})}" method="post"><button type="submit" class="pf-btn pf-btn--secondary">Mit gleichem Wunsch neu generieren</button></form><a class="pf-btn pf-btn--ghost" th:href="@{/projects/{id}/plan(id=${proposal.projectId})}">Zurück</a></div>
</main><th:block th:replace="~{fragments/layout :: site-footer}" /></body></html>
