<!DOCTYPE html><html lang="de" xmlns:th="http://www.thymeleaf.org"><head><th:block th:replace="~{fragments/layout :: head('Plan mit KI anpassen')}" /><link rel="stylesheet" th:href="@{/css/components/loading-screen.css}"></head><body>
<header th:replace="~{fragments/layout :: site-header}"></header><main id="plan-change-content" class="pf-page pf-page--narrow">
<a th:href="@{/projects/{id}/plan(id=${projectId})}" class="pf-back-link">← Zurück zum Plan</a><div class="pf-card">
<h1>Plan mit KI anpassen</h1><p class="pf-text-muted">Beschreibe eine gezielte Änderung. Die KI erstellt nur einen temporären Vorschlag; dein aktiver Plan bleibt unverändert.</p>
<div th:if="${errorMessage}" class="pf-alert pf-alert--error" role="alert" th:text="${errorMessage}"></div>
<form th:action="@{/projects/{id}/plan/ai-change(id=${projectId})}" th:object="${planChangeForm}" method="post"
      data-loading-screen-target="plan-change-loading" data-loading-content-target="plan-change-content"><div class="pf-form-group">
<label for="changeRequest" class="pf-label">Gewünschte Änderung</label><textarea id="changeRequest" th:field="*{changeRequest}" maxlength="1000" required class="pf-textarea" rows="6" placeholder="z. B. Ergänze eine Aufgabe für die Wohnungsübergabe."></textarea>
<small th:if="${session != null and session.studySessionId != null}" class="pf-hint" style="display:block; margin-top:0.25rem;">Bitte gib keine echten personenbezogenen, vertraulichen oder sensiblen Informationen ein.</small>
<div th:if="${#fields.hasErrors('changeRequest')}" th:errors="*{changeRequest}" class="pf-alert pf-alert--error"></div></div>
<div class="pf-cluster"><button class="pf-btn pf-btn--primary" type="submit">Vorschlag erzeugen</button><a class="pf-btn pf-btn--secondary" th:href="@{/projects/{id}/plan(id=${projectId})}">Abbrechen</a></div></form></div>
</main>
<main id="plan-change-loading" class="pf-loading-container" hidden aria-hidden="true">
    <div class="pf-loading-card">
        <th:block th:replace="~{fragments/loading-screen :: processing(
            'Planänderung wird vorbereitet',
            'Die KI prüft deinen Änderungswunsch und erstellt einen überprüfbaren Vorschlag.',
            'Fortschritt der KI-Plananpassung',
            'Änderungswunsch prüfen',
            'Der Wunsch wird auf den aktuellen Projektplan bezogen.',
            'Vorschlag erstellen',
            'Die betroffenen Bereiche und Aufgaben werden neu ausgearbeitet.',
            2,
            'KI-Vorschlag wird erstellt')}" />
    </div>
</main>
<script th:src="@{/js/loading-screen.js}"></script>
<th:block th:replace="~{fragments/layout :: site-footer}" /></body></html>
