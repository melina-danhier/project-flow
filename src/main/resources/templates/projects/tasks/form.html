<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head(${editing ? 'Aufgabe bearbeiten' : 'Aufgabe anlegen'})}" />
</head>
<body>
<th:block th:replace="~{fragments/layout :: site-header}" />

<main>
    <div class="pf-page-header">
        <div class="pf-page-header__left">
            <a th:href="${editing} ? @{/projects/{projectId}/tasks/{taskId}(projectId=${projectId},taskId=${taskId})} : @{/projects/{projectId}/plan(projectId=${projectId})}" class="pf-page-header__back">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Abbrechen
            </a>
            <h1 th:text="${editing ? 'Aufgabe bearbeiten' : 'Aufgabe anlegen'}" style="margin: 0;">Aufgabe</h1>
        </div>
    </div>

    <div th:if="${errorMessage}" class="pf-alert pf-alert--error" role="alert" th:text="${errorMessage}"></div>

    <div class="pf-card" style="max-width: 760px;">
        <form th:action="${editing} ? @{/projects/{projectId}/tasks/{taskId}(projectId=${projectId},taskId=${taskId})} : @{/projects/{projectId}/tasks(projectId=${projectId})}"
              th:object="${taskForm}" method="post">
            <input th:if="${editing}" type="hidden" th:field="*{lockVersion}">
            <input th:if="${editing}" type="hidden" th:field="*{sortOrder}">
            <div th:if="${#fields.hasErrors('lockVersion')}" class="pf-alert pf-alert--error" role="alert">
                Die Aufgabe konnte nicht gespeichert werden, weil der Bearbeitungsstand ungültig ist. Bitte lade die Seite neu.
            </div>
            
            <th:block th:replace="~{fragments/form-fields :: title-field('Aufgabentitel')}" />
            <th:block th:replace="~{fragments/form-fields :: description-field('Beschreibung', false)}" />
            
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem;">
                <div class="pf-form-group">
                    <label for="status" class="pf-label">Status</label>
                    <select id="status" th:field="*{status}" class="pf-select">
                        <option value="OPEN">Offen</option>
                        <option value="IN_PROGRESS">In Bearbeitung</option>
                        <option value="COMPLETED">Erledigt</option>
                    </select>
                    <div th:if="${#fields.hasErrors('status')}" th:errors="*{status}" class="pf-alert pf-alert--error" role="alert"></div>
                    <div id="blocked-completion-warning" th:if="${editing and taskBlocked}"
                         class="pf-alert pf-alert--warning" role="status" hidden style="margin-top: 0.75rem;">
                        <div>
                            <span>Folgende Voraussetzungen sind noch offen. Du kannst die Aufgabe trotzdem als erledigt speichern:</span>
                            <ul style="margin: 0.5rem 0 0 1.25rem;">
                                <li th:each="prerequisite : ${openPrerequisites}" th:text="${prerequisite.title}"></li>
                            </ul>
                        </div>
                    </div>
                </div>

                <div class="pf-form-group">
                    <label for="priority" class="pf-label">Priorität</label>
                    <select id="priority" th:field="*{priority}" required class="pf-select">
                        <option value="LOW">Niedrig</option>
                        <option value="MEDIUM">Mittel</option>
                        <option value="HIGH">Hoch</option>
                    </select>
                    <div th:if="${#fields.hasErrors('priority')}" th:errors="*{priority}" class="pf-alert pf-alert--error" role="alert"></div>
                </div>
            </div>

            <th:block th:replace="~{fragments/form-fields :: section-selector(${sections})}" />

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem;">
                <div class="pf-form-group">
                    <label for="startDate" class="pf-label">Startdatum</label>
                    <input id="startDate" type="date" th:field="*{startDate}" class="pf-input">
                    <div th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}" class="pf-alert pf-alert--error" role="alert"></div>
                </div>
                <div class="pf-form-group">
                    <label for="dueDate" class="pf-label">Fälligkeitsdatum</label>
                    <input id="dueDate" type="date" th:field="*{dueDate}" class="pf-input">
                    <div th:if="${#fields.hasErrors('dueDate')}" th:errors="*{dueDate}" class="pf-alert pf-alert--error" role="alert"></div>
                </div>
            </div>
            <div th:if="${#fields.hasErrors('dateRangeValid')}" th:errors="*{dateRangeValid}" class="pf-alert pf-alert--error" role="alert"></div>

            <div th:if="${groupProject}" class="pf-form-group">
                <label for="assignee" class="pf-label">Zuständigkeit</label>
                <select id="assignee" th:field="*{assigneeId}" class="pf-select">
                    <option value="">Nicht zugewiesen</option>
                    <option th:each="member : ${assignees}" th:value="${member.id}" th:text="${member.displayName}"></option>
                </select>
                <div th:if="${#fields.hasErrors('assigneeId')}" th:errors="*{assigneeId}" class="pf-alert pf-alert--error" role="alert"></div>
            </div>

            <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--pf-border); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem;">
                <a th:href="${editing} ? @{/projects/{projectId}/tasks/{taskId}(projectId=${projectId},taskId=${taskId})} : @{/projects/{projectId}/plan(projectId=${projectId})}"
                   class="pf-btn pf-btn--secondary">Abbrechen</a>
                <button type="submit" class="pf-btn pf-btn--primary" th:text="${editing ? 'Aufgabe speichern' : 'Aufgabe anlegen'}">Speichern</button>
            </div>
        </form>
    </div>
</main>

<script th:if="${editing and taskBlocked}">
    (() => {
        const status = document.getElementById('status');
        const warning = document.getElementById('blocked-completion-warning');
        const updateWarning = () => warning.hidden = status.value !== 'COMPLETED';
        status.addEventListener('change', updateWarning);
        updateWarning();
    })();
</script>

<th:block th:replace="~{fragments/layout :: site-footer}" />
</body>
</html>
