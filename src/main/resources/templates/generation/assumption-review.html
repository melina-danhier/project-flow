<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head('Kritische Annahmen prüfen')}" />
    <link rel="stylesheet" th:href="@{/css/draft-review.css}">
</head>
<body>
<th:block th:replace="~{fragments/layout :: site-header}" />

<main class="assumption-review">
    <div class="pf-page-header">
        <div class="pf-page-header__left">
            <div class="pf-cluster" style="margin-bottom: 0.25rem;">
                <span class="pf-badge pf-badge--yellow">Plausibilität</span>
                <span class="pf-badge pf-badge--gray">Annahmen</span>
            </div>
            <h1 style="margin: 0;">Kritische Annahmen prüfen</h1>
            <p class="pf-page-header__subtitle">
                Bitte prüfe alle Annahmen. Der erzeugte Entwurf wird erst danach angezeigt.
            </p>
        </div>
    </div>

    <div style="max-width: 780px;">
        <p th:if="${review.errorMessage}" th:text="${review.errorMessage}" role="alert" class="error-message pf-alert pf-alert--error"></p>

        <form id="assumption-review-form" th:action="@{/projects/new/ai/assumptions/{id}(id=${review.workflowId})}" method="post">
            <div class="pf-stack">
                <fieldset class="assumption-card" th:each="assumption : ${review.assumptions}"
                          th:attr="data-correction-required=${assumption.correctionRequiredIfRejected}">
                    <legend style="font-size: 1rem; color: var(--pf-text-main);" th:text="${assumption.statement}">Annahme</legend>
                    <input type="hidden" th:name="${'decisions[' + assumption.index + '].assumptionIndex'}"
                           th:value="${assumption.index}">
                    <div style="display: flex; gap: 1.5rem; margin-top: 0.5rem;">
                        <label>
                            <input type="radio" th:name="${'decisions[' + assumption.index + '].decision'}" value="CONFIRMED" required
                                   th:checked="${assumption.decision?.name() == 'CONFIRMED'}"> <span>Trifft zu</span>
                        </label>
                        <label>
                            <input type="radio" th:name="${'decisions[' + assumption.index + '].decision'}" value="REJECTED" required
                                   th:checked="${assumption.decision?.name() == 'REJECTED'}"> <span>Trifft nicht zu</span>
                        </label>
                    </div>
                    <div class="assumption-correction" th:if="${assumption.correctionRequiredIfRejected}" style="margin-top: 0.85rem;">
                        <label th:for="${'correction-' + assumption.index}" class="pf-label">Was trifft stattdessen zu?</label>
                        <textarea th:id="${'correction-' + assumption.index}" class="pf-textarea"
                                  th:name="${'decisions[' + assumption.index + '].correction'}" maxlength="2000"
                                  th:text="${assumption.correction}"></textarea>
                    </div>
                </fieldset>
            </div>

            <div style="margin-top: 2rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;">
                <button id="assumption-submit" type="submit" class="pf-btn pf-btn--primary pf-btn--lg" disabled>
                    Entwurf anzeigen →
                </button>
                <button type="submit" form="cancel-ai-creation" class="pf-btn pf-btn--secondary">Abbrechen</button>
            </div>
        </form>
        <form id="cancel-ai-creation"
              th:action="@{/projects/new/ai/status/{workflowId}/cancel(workflowId=${review.workflowId})}"
              method="post"
              onsubmit="return confirm('Möchtest du die KI-Projekterstellung wirklich abbrechen? Das gesamte Projekt einschließlich Entwurf und Eingaben wird dauerhaft gelöscht.');"
              style="display: none;"></form>
    </div>

    <script th:src="@{/js/assumption-review.js}" defer></script>
</main>

<th:block th:replace="~{fragments/layout :: site-footer}" />
</body>
</html>
