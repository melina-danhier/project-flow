<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Zusätzliche KI-Angaben – ProjectFlow</title></head>
<body><main>
<p>Schritt 3</p>
<h1>Angaben passend zu deinem Projekt</h1>
<p>Beantworte nur, was bereits feststeht. Diese Angaben helfen bei Vorprüfung und Planentwurf für „<span th:text="${wizardState.title}">Projekt</span>“.</p>
<form th:action="@{/projects/new/ai/details}" th:object="${aiProjectDetailsForm}" method="post">
    <div th:if="${#fields.hasAnyErrors()}" th:each="error : ${#fields.allErrors()}"
         th:text="${error}" role="alert"></div>
    <div th:each="question : ${questions}">
        <label th:for="|answer-${question.key}|" th:text="${question.label + (question.required ? '' : ' (optional)')}"></label>
        <textarea th:id="|answer-${question.key}|"
                  th:field="*{answers[__${question.key}__]}"
                  th:maxlength="${question.maxLength}" th:required="${question.required}"></textarea>
        <p th:if="${question.helpText != null}" th:text="${question.helpText}"></p>
    </div>

    <button type="submit">Weiter zur Zusammenfassung</button>
</form>
<a th:href="@{/projects/new/method}">Zurück zur Erstellungsart</a>
<form th:action="@{/projects/new/cancel}" method="post">
    <button type="submit">Projekterstellung abbrechen</button>
</form>
</main></body></html>
