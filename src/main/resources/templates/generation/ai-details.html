<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head('Angaben passend zu deinem Projekt')}" />
</head>
<body>
<th:block th:replace="~{fragments/layout :: site-header}" />

<main>
    <div class="pf-page-header">
        <div class="pf-page-header__left">
            <div class="pf-cluster" style="margin-bottom: 0.25rem;">
                <span class="pf-badge pf-badge--purple">Schritt 3</span>
                <span class="pf-badge pf-badge--gray">KI-Projektfragen</span>
            </div>
            <h1 style="margin: 0;">Angaben passend zu deinem Projekt</h1>
            <p class="pf-page-header__subtitle">
                Beantworte nur, was bereits feststeht. Diese Angaben helfen bei Vorprüfung und Planentwurf für „<strong th:text="${wizardState.title}">Projekt</strong>“.
            </p>
        </div>
    </div>

    <div class="pf-card" style="max-width: 760px;">
        <form th:action="@{/projects/new/ai/details}" th:object="${aiProjectDetailsForm}" method="post">
            <div th:if="${#fields.hasAnyErrors()}" th:each="error : ${#fields.allErrors()}"
                 class="pf-alert pf-alert--error" th:text="${error}" role="alert"></div>

            <div class="pf-form-group">
                <label for="availableWorkingTime" class="pf-label">
                   <span>Wie viel Arbeitszeit kannst du ungefähr für das Projekt aufbringen?</span>
                   <span class="pf-hint">(optional)</span>
                </label>
                <input id="availableWorkingTime"
                      class="pf-input"
                      type="text"
                      th:field="*{availableWorkingTime}"
                      maxlength="1000"
                      placeholder="z. B. ca. 5 Stunden pro Woche oder nur am Wochenende">
                <div th:if="${#fields.hasErrors('availableWorkingTime')}"
                    th:errors="*{availableWorkingTime}"
                    class="pf-alert pf-alert--error" role="alert"></div>
            </div>

            <div th:each="question : ${questions}" class="pf-form-group">
                <label th:for="|answer-${question.key}|" class="pf-label">
                    <span th:text="${question.label}">Frage</span>
                    <span th:if="${!question.required}" class="pf-hint">(optional)</span>
                    <span th:if="${question.required}" class="pf-required-star" aria-hidden="true">*</span>
                </label>
                <textarea th:id="|answer-${question.key}|"
                          class="pf-textarea"
                          th:field="*{answers[__${question.key}__]}"
                          th:maxlength="${question.maxLength}"
                          th:required="${question.required}"></textarea>
                <p th:if="${question.helpText != null}" class="pf-hint" th:text="${question.helpText}"></p>
            </div>

            <div class="pf-form-group">
                <label for="additionalInformation" class="pf-label">
                    <span>Zusätzliche Wünsche oder Einschränkungen</span>
                    <span class="pf-hint">(optional)</span>
                </label>
                <textarea id="additionalInformation"
                          class="pf-textarea"
                          th:field="*{additionalInformation}"
                          maxlength="2000"
                          placeholder="z. B. Besondere Prioritäten, bestimmte Tools oder zeitliche Einschränkungen..."></textarea>
                <div th:if="${#fields.hasErrors('additionalInformation')}"
                     th:errors="*{additionalInformation}"
                     class="pf-alert pf-alert--error" role="alert"></div>
            </div>

            <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--pf-border); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem;">
                <div style="display: flex; align-items: center; gap: 0.75rem;">
                    <a th:href="@{/projects/new/method}" class="pf-btn pf-btn--secondary">
                        ← Zurück zur Erstellungsart
                    </a>
                    <button type="submit" form="wizard-cancel-form" class="pf-btn pf-btn--ghost" style="color: var(--pf-text-muted);">
                        Abbrechen
                    </button>
                </div>
                <button type="submit" class="pf-btn pf-btn--primary">
                    Weiter zur Zusammenfassung →
                </button>
            </div>
        </form>

        <form id="wizard-cancel-form" th:action="@{/projects/new/cancel}" method="post"
              onsubmit="return confirm('Möchtest du die KI-Projekterstellung wirklich abbrechen? Alle bisherigen Eingaben werden gelöscht.');"
              style="display: none;"></form>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: site-footer}" />
</body>
</html>
