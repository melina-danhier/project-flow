<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head(${draftElement.type == 'TASK' ? 'Entwurfsaufgabe' : 'Entwurfsmeilenstein'})}" />
    <link rel="stylesheet" th:href="@{/css/draft-review.css}">
</head>
<body>
<th:block th:replace="~{fragments/layout :: site-header}" />

<main th:attr="data-project-id=${draft.projectId},data-draft-status=${draft.status.name()}">
    <div class="pf-page-header">
        <div class="pf-page-header__left">
            <a th:href="@{/projects/{projectId}/draft/review(projectId=${draft.projectId})}" class="pf-page-header__back">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Zum Entwurf
            </a>
            <div class="pf-cluster">
                <h1 th:text="${draftElement.title}" style="margin: 0;">Entwurfselement</h1>
                <span th:if="${draftElement.type == 'MILESTONE'}" class="pf-badge pf-badge--purple">Meilenstein</span>
                <span class="pf-badge pf-badge--outline" th:text="${draftElement.originLabel}"></span>
                <span class="pf-badge"
                      th:classappend="${draftElement.reviewStatus.name() == 'ACCEPTED' ? 'pf-badge--green' : (draftElement.reviewStatus.name() == 'REJECTED' ? 'pf-badge--red' : 'pf-badge--yellow')}"
                      th:text="${draftElement.reviewStatus.name() == 'PENDING' ? 'Offen' : (draftElement.reviewStatus.name() == 'ACCEPTED' ? 'Übernommen' : 'Verworfen')}"></span>
            </div>
        </div>
    </div>

    <th:block th:replace="~{fragments/flash-messages :: all}" />

    <div class="pf-grid pf-grid--2" style="align-items: start;">
        <section class="pf-card">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; border-bottom: 1px solid var(--pf-border); padding-bottom: 0.75rem;">
                <h2 style="margin: 0; font-size: 1.15rem;">Details</h2>
                <div th:if="${draft.status.name() != 'APPLIED'}">
                    <a th:if="${draftElement.type == 'TASK'}" class="pf-btn pf-btn--ghost pf-btn--sm"
                       th:href="@{/projects/{projectId}/draft/tasks/{taskId}/edit(projectId=${draft.projectId},taskId=${draftElement.id})}"
                       style="color: var(--pf-primary); font-weight: 600; font-size: 0.82rem;">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                        </svg>
                        Aufgabe bearbeiten
                    </a>
                    <a th:if="${draftElement.type == 'MILESTONE'}" class="pf-btn pf-btn--ghost pf-btn--sm"
                       th:href="@{/projects/{projectId}/draft/milestones/{milestoneId}/edit(projectId=${draft.projectId},milestoneId=${draftElement.id})}"
                       style="color: var(--pf-primary); font-weight: 600; font-size: 0.82rem;">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                        </svg>
                        Meilenstein bearbeiten
                    </a>
                </div>
            </div>
            <div style="display: grid; gap: 0.85rem;">
                <div>
                    <span class="pf-detail-label">Beschreibung</span>
                    <p style="margin: 0.25rem 0 0; white-space: pre-line;" th:text="${draftElement.description ?: 'Keine Beschreibung vorhanden.'}"></p>
                </div>
                <div class="pf-detail-grid">
                    <div><span class="pf-detail-label">Phase</span><div th:text="${sectionTitle}"></div></div>
                    <div th:if="${draftElement.type == 'TASK'}"><span class="pf-detail-label">Priorität</span><div th:text="${draftElement.priority != null ? (draftElement.priority.name() == 'LOW' ? 'Niedrig' : (draftElement.priority.name() == 'HIGH' ? 'Hoch' : 'Mittel')) : 'Nicht festgelegt'}"></div></div>
                </div>
                <div class="pf-detail-grid">
                    <div th:if="${draftElement.type == 'TASK'}"><span class="pf-detail-label">Startdatum</span><div th:text="${draftElement.startDate != null ? #temporals.format(draftElement.startDate, 'dd.MM.yyyy') : 'Nicht festgelegt'}"></div></div>
                    <div><span class="pf-detail-label" th:text="${draftElement.type == 'TASK' ? 'Fälligkeitsdatum' : 'Zieldatum'}"></span><div th:text="${draftElement.dueDate != null ? #temporals.format(draftElement.dueDate, 'dd.MM.yyyy') : 'Nicht festgelegt'}"></div></div>
                </div>
                <div th:if="${draftElement.type == 'TASK'}" class="pf-detail-row">
                    <span class="pf-detail-label">Aufwand</span>
                    <div th:text="${draftElement.estimatedHours != null ? draftElement.estimatedHours + ' Stunden' : 'Nicht festgelegt'}"></div>
                </div>
            </div>
        </section>

        <div class="pf-stack">
            <section class="pf-card" th:if="${draft.status.name() != 'APPLIED'}">
                <h2 style="margin-bottom: 0.5rem; font-size: 1.15rem;">Vorschlag prüfen</h2>
                <p class="pf-text-muted" style="margin-bottom: 1rem; font-size: 0.88rem;">Entscheide, ob dieses Element in den Projektplan übernommen werden soll.</p>
                <div class="review-actions review-actions--desktop pf-cluster" style="gap: 0.5rem;">
                    <!-- Offen (Reset) -->
                    <form th:action="@{/projects/{projectId}/draft/elements/{elementId}/reset(projectId=${draft.projectId},elementId=${draftElement.id})}"
                          method="post" style="margin: 0;">
                        <input type="hidden" name="lockVersion" th:value="${draft.lockVersion}">
                        <input type="hidden" name="detail" value="true">
                        <button th:if="${draftElement.reviewStatus.name() != 'PENDING'}" class="pf-btn pf-btn--sm pf-btn--ghost review-btn review-btn--pending" type="submit" title="Auf offen setzen">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle></svg>
                            <span>Offen</span>
                        </button>
                        <button th:if="${draftElement.reviewStatus.name() == 'PENDING'}" class="pf-btn pf-btn--sm pf-btn--outline review-btn review-btn--pending is-active" type="button" disabled title="Bereits offen">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle></svg>
                            <span>Offen</span>
                        </button>
                    </form>

                    <!-- Übernehmen (Accept) -->
                    <form th:action="@{/projects/{projectId}/draft/elements/{elementId}/accept(projectId=${draft.projectId},elementId=${draftElement.id})}"
                          method="post" style="margin: 0;">
                        <input type="hidden" name="lockVersion" th:value="${draft.lockVersion}">
                        <input type="hidden" name="detail" value="true">
                        <button th:if="${draftElement.reviewStatus.name() != 'ACCEPTED'}" class="pf-btn pf-btn--sm pf-btn--ghost review-btn review-btn--accept" type="submit" title="Übernehmen">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                            <span>Übernehmen</span>
                        </button>
                        <button th:if="${draftElement.reviewStatus.name() == 'ACCEPTED'}" class="pf-btn pf-btn--sm pf-btn--primary review-btn review-btn--accept is-active" type="button" disabled title="Bereits übernommen">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                            <span>Übernommen</span>
                        </button>
                    </form>

                    <!-- Ablehnen (Reject) -->
                    <form th:action="@{/projects/{projectId}/draft/elements/{elementId}/reject(projectId=${draft.projectId},elementId=${draftElement.id})}"
                          method="post" style="margin: 0;">
                        <input type="hidden" name="lockVersion" th:value="${draft.lockVersion}">
                        <input type="hidden" name="detail" value="true">
                        <button th:if="${draftElement.reviewStatus.name() != 'REJECTED'}" class="pf-btn pf-btn--sm pf-btn--ghost pf-btn--danger review-btn review-btn--reject" type="submit" title="Ablehnen">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                            <span>Ablehnen</span>
                        </button>
                        <button th:if="${draftElement.reviewStatus.name() == 'REJECTED'}" class="pf-btn pf-btn--sm pf-btn--danger review-btn review-btn--reject is-active" type="button" disabled title="Bereits abgelehnt">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                            <span>Abgelehnt</span>
                        </button>
                    </form>
                </div>
            </section>
        </div>
    </div>
</main>

<script th:src="@{/js/plan-views.js}"></script>
<th:block th:replace="~{fragments/layout :: site-footer}" />
</body>
</html>
