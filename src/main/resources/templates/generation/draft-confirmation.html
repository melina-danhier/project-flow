<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kritische Annahmen bestätigen – ProjectFlow</title>
    <link rel="stylesheet" th:href="@{/css/draft-review.css}">
</head>
<body><main>
<h1>Kritische Annahmen bestätigen</h1>
<p>Diese Aufgaben enthalten noch ungeprüfte kritische Annahmen. Bitte lies sie vor der Übernahme.
    Der Plan wurde noch nicht übernommen.</p>
<ul><li th:each="element : ${draft.uncheckedCriticalTasks}">
    <h2 th:text="${element.title}"></h2>
    <p class="full-assumption" th:text="${element.criticalAssumption}"></p>
</li></ul>
<form th:action="@{/projects/{projectId}/draft/confirm-and-apply(projectId=${draft.projectId})}" method="post">
    <input type="hidden" name="lockVersion" th:value="${draft.lockVersion}">
    <button type="submit">Kritische Annahmen bestätigen und Plan übernehmen</button>
</form>
<a th:href="@{/projects/{projectId}/draft(projectId=${draft.projectId})}">Zurück zum Entwurf</a>
</main></body></html>
