<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head('Anfrage nicht möglich')}" />
</head>
<body>
<th:block th:replace="~{fragments/layout :: site-header}" />
<main>
    <div class="pf-card" style="max-width: 680px; margin: 3rem auto; text-align: center;">
        <span class="pf-badge pf-badge--yellow" th:text="|Fehler ${statusCode}|">Fehler</span>
        <h1>Die Anfrage konnte nicht verarbeitet werden</h1>
        <p th:text="${errorMessage}">Bitte prüfe die Anfrage und versuche es erneut.</p>
        <a class="pf-btn pf-btn--primary" th:href="@{/projects}">Zur Projektübersicht</a>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: site-footer}" />
</body>
</html>
