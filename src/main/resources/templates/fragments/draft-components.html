<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="review-actions(pathSegment, entityId, projectId, reviewStatusName, lockVersion)"
     class="review-actions">
    <form th:if="${reviewStatusName != 'ACCEPTED'}"
          th:action="@{/projects/{pId}/draft/{seg}/{eId}/accept(pId=${projectId},seg=${pathSegment},eId=${entityId})}"
          method="post">
        <input type="hidden" name="lockVersion" th:value="${lockVersion}">
        <button class="pf-btn pf-btn--sm pf-btn--outline" type="submit">Übernehmen</button>
    </form>
    <form th:if="${reviewStatusName != 'REJECTED'}"
          th:action="@{/projects/{pId}/draft/{seg}/{eId}/reject(pId=${projectId},seg=${pathSegment},eId=${entityId})}"
          method="post">
        <input type="hidden" name="lockVersion" th:value="${lockVersion}">
        <button class="pf-btn pf-btn--sm pf-btn--ghost pf-btn--danger button-reject" type="submit">Verwerfen</button>
    </form>
    <form th:if="${reviewStatusName != 'PENDING'}"
          th:action="@{/projects/{pId}/draft/{seg}/{eId}/reset(pId=${projectId},seg=${pathSegment},eId=${entityId})}"
          method="post">
        <input type="hidden" name="lockVersion" th:value="${lockVersion}">
        <button class="pf-btn pf-btn--sm pf-btn--ghost button-secondary" type="submit">Auf offen setzen</button>
    </form>
</div>

<div th:fragment="element-heading(element, projectId)" class="element-heading">
    <button type="button" class="drag-handle element-drag-handle pf-drag-handle" title="Element verschieben"
            aria-label="Element verschieben">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="5" r="1.5"></circle><circle cx="9" cy="12" r="1.5"></circle><circle cx="9" cy="19" r="1.5"></circle>
            <circle cx="15" cy="5" r="1.5"></circle><circle cx="15" cy="12" r="1.5"></circle><circle cx="15" cy="19" r="1.5"></circle>
        </svg>
    </button>
    <span class="element-icon pf-milestone-diamond" aria-hidden="true" th:if="${element.type == 'MILESTONE'}">◆</span>
    <a th:if="${element.type == 'TASK'}" th:href="@{/projects/{projectId}/draft/tasks/{taskId}(projectId=${projectId},taskId=${element.id})}"
       th:text="${element.title}" class="pf-element-title"></a>
    <a th:if="${element.type == 'MILESTONE'}" th:href="@{/projects/{projectId}/draft/milestones/{milestoneId}(projectId=${projectId},milestoneId=${element.id})}"
       th:text="${element.title}" class="pf-element-title"></a>
    <span class="pf-badge pf-badge--yellow pf-badge--outline"
          th:if="${element.visibleOriginLabel != null}"
          th:text="${element.visibleOriginLabel}"></span>
</div>

<th:block th:fragment="element-edit-forms(element, projectId, lockVersion, editingDraftTaskId, editingDraftMilestoneId)">
    <form th:if="${element.type == 'TASK' and editingDraftTaskId != element.id}"
          th:action="@{/projects/{pId}/draft/tasks/{tId}(pId=${projectId},tId=${element.id})}"
          method="post">
        <input type="hidden" name="lockVersion" th:value="${lockVersion}">
        <label th:for="${'task-title-' + element.id}">Titel</label>
        <input th:id="${'task-title-' + element.id}" name="title" th:value="${element.title}"
               required maxlength="100">
        <label th:for="${'task-description-' + element.id}">Beschreibung</label>
        <textarea th:id="${'task-description-' + element.id}" name="description" maxlength="2000"
                  th:text="${element.description}"></textarea>
        <label th:for="${'task-priority-' + element.id}">Priorität</label>
        <select th:id="${'task-priority-' + element.id}" name="priority">
            <option value="LOW" th:selected="${element.priority.name() == 'LOW'}">Niedrig</option>
            <option value="MEDIUM" th:selected="${element.priority.name() == 'MEDIUM'}">Mittel</option>
            <option value="HIGH" th:selected="${element.priority.name() == 'HIGH'}">Hoch</option>
        </select>
        <label th:for="${'task-hours-' + element.id}">Aufwand in Stunden</label>
        <input th:id="${'task-hours-' + element.id}" type="number" name="estimatedHours" min="1"
               th:value="${element.estimatedHours}">
        <label th:for="${'task-start-' + element.id}">Startdatum</label>
        <input th:id="${'task-start-' + element.id}" type="date" name="startDate"
               th:value="${element.startDate}">
        <label th:for="${'task-due-' + element.id}">Deadline</label>
        <input th:id="${'task-due-' + element.id}" type="date" name="dueDate"
               th:value="${element.dueDate}">
        <button type="submit">Aufgabe speichern</button>
    </form>
    <form th:if="${element.type == 'TASK' and editingDraftTaskId == element.id}"
          th:object="${draftTaskForm}"
          th:action="@{/projects/{pId}/draft/tasks/{tId}(pId=${projectId},tId=${element.id})}"
          method="post">
        <input type="hidden" th:field="*{lockVersion}">
        <div th:if="${#fields.hasErrors('lockVersion')}" class="pf-alert pf-alert--error" role="alert">
            Der Entwurf konnte nicht gespeichert werden, weil der Bearbeitungsstand ungültig ist. Bitte lade die Seite neu.
        </div>
        <div th:each="error : ${#fields.globalErrors()}" th:text="${error}" class="pf-alert pf-alert--error" role="alert"></div>
        <label th:for="${'task-title-' + element.id}">Titel</label>
        <input th:id="${'task-title-' + element.id}" th:field="*{title}" required maxlength="100">
        <div th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="pf-alert pf-alert--error" role="alert"></div>
        <label th:for="${'task-description-' + element.id}">Beschreibung</label>
        <textarea th:id="${'task-description-' + element.id}" th:field="*{description}" maxlength="2000"></textarea>
        <div th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="pf-alert pf-alert--error" role="alert"></div>
        <label th:for="${'task-priority-' + element.id}">Priorität</label>
        <select th:id="${'task-priority-' + element.id}" th:field="*{priority}">
            <option value="LOW">Niedrig</option>
            <option value="MEDIUM">Mittel</option>
            <option value="HIGH">Hoch</option>
        </select>
        <div th:if="${#fields.hasErrors('priority')}" th:errors="*{priority}" class="pf-alert pf-alert--error" role="alert"></div>
        <label th:for="${'task-hours-' + element.id}">Aufwand in Stunden</label>
        <input th:id="${'task-hours-' + element.id}" type="number" th:field="*{estimatedHours}" min="1">
        <div th:if="${#fields.hasErrors('estimatedHours')}" th:errors="*{estimatedHours}" class="pf-alert pf-alert--error" role="alert"></div>
        <label th:for="${'task-start-' + element.id}">Startdatum</label>
        <input th:id="${'task-start-' + element.id}" type="date" th:field="*{startDate}">
        <div th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}" class="pf-alert pf-alert--error" role="alert"></div>
        <label th:for="${'task-due-' + element.id}">Deadline</label>
        <input th:id="${'task-due-' + element.id}" type="date" th:field="*{dueDate}">
        <div th:if="${#fields.hasErrors('dueDate')}" th:errors="*{dueDate}" class="pf-alert pf-alert--error" role="alert"></div>
        <div th:if="${#fields.hasErrors('dateRangeValid')}" th:errors="*{dateRangeValid}" class="pf-alert pf-alert--error" role="alert"></div>
        <button type="submit">Aufgabe speichern</button>
    </form>
    <form th:if="${element.type == 'MILESTONE' and editingDraftMilestoneId != element.id}"
          th:action="@{/projects/{pId}/draft/milestones/{mId}(pId=${projectId},mId=${element.id})}"
          method="post">
        <input type="hidden" name="lockVersion" th:value="${lockVersion}">
        <label th:for="${'milestone-title-' + element.id}">Titel</label>
        <input th:id="${'milestone-title-' + element.id}" name="title" th:value="${element.title}"
               required maxlength="100">
        <label th:for="${'milestone-date-' + element.id}">Datum</label>
        <input th:id="${'milestone-date-' + element.id}" type="date" name="dueDate"
               th:value="${element.dueDate}">
        <button type="submit">Meilenstein speichern</button>
    </form>
    <form th:if="${element.type == 'MILESTONE' and editingDraftMilestoneId == element.id}"
          th:object="${draftMilestoneForm}"
          th:action="@{/projects/{pId}/draft/milestones/{mId}(pId=${projectId},mId=${element.id})}"
          method="post">
        <input type="hidden" th:field="*{lockVersion}">
        <div th:if="${#fields.hasErrors('lockVersion')}" class="pf-alert pf-alert--error" role="alert">
            Der Entwurf konnte nicht gespeichert werden, weil der Bearbeitungsstand ungültig ist. Bitte lade die Seite neu.
        </div>
        <div th:each="error : ${#fields.globalErrors()}" th:text="${error}" class="pf-alert pf-alert--error" role="alert"></div>
        <label th:for="${'milestone-title-' + element.id}">Titel</label>
        <input th:id="${'milestone-title-' + element.id}" th:field="*{title}" required maxlength="100">
        <div th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="pf-alert pf-alert--error" role="alert"></div>
        <label th:for="${'milestone-date-' + element.id}">Datum</label>
        <input th:id="${'milestone-date-' + element.id}" type="date" th:field="*{dueDate}">
        <div th:if="${#fields.hasErrors('dueDate')}" th:errors="*{dueDate}" class="pf-alert pf-alert--error" role="alert"></div>
        <button type="submit">Meilenstein speichern</button>
    </form>
</th:block>

</body>
</html>
