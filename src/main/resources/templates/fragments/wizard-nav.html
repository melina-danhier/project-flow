<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<body>
<form th:fragment="cancel(buttonText)" th:action="@{/projects/new/cancel}" method="post"
      data-confirm="Möchtest du die Projekterstellung wirklich abbrechen? Alle bisherigen Eingaben werden gelöscht."
      data-confirm-title="Projekterstellung abbrechen?"
      data-confirm-btn="Erstellung abbrechen"
      data-confirm-variant="danger"
      style="display: inline-block; margin: 0;">
    <button type="submit" class="pf-btn pf-btn--ghost" style="color: var(--pf-text-muted);" th:text="${buttonText}">Abbrechen</button>
</form>
</body>
</html>
