<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<body>

<svg th:fragment="logo"
     class="brand__logo"
     viewBox="0 0 38 38"
     fill="none"
     stroke="currentColor"
     stroke-width="2.2"
     stroke-linecap="round"
     stroke-linejoin="round"
     aria-hidden="true">
    <polygon points="12.5,12.5 19,19 12.5,25.5 6,19" />
    <polyline points="20.5,13 26.5,19 20.5,25" />
    <polyline points="25.5,13 31.5,19 25.5,25" />
</svg>

<svg th:fragment="arrow-left(size, strokeWidth)"
     th:attr="width=${size},height=${size},stroke-width=${strokeWidth}"
     viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor"
     stroke-linecap="round"
     stroke-linejoin="round"
     aria-hidden="true">
    <line x1="19" y1="12" x2="5" y2="12" />
    <polyline points="12 19 5 12 12 5" />
</svg>

</body>
</html>
