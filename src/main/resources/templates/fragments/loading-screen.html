<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="processing(title, subtitle, progressLabel, firstStepTitle, firstStepDescription, secondStepTitle, secondStepDescription, activeStep, heartbeatText)">
    <div class="pf-loading-hero">
        <div class="pf-loading-icon-wrap" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"></path>
            </svg>
        </div>
        <h1 class="pf-loading-title" th:text="${title}">KI-Vorgang wird ausgeführt</h1>
        <p class="pf-loading-subtitle" th:text="${subtitle}">Die Verarbeitung kann einen Moment dauern.</p>
    </div>

    <div class="pf-stepper" role="list" th:attr="aria-label=${progressLabel}">
        <div class="pf-step" th:classappend="${activeStep > 1 ? ' is-completed' : ' is-active'}" role="listitem">
            <div class="pf-step-badge">
                <span th:if="${activeStep > 1}">✓</span>
                <svg th:if="${activeStep == 1}" class="pf-spinner-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <circle cx="12" cy="12" r="10" stroke-opacity="0.25"></circle>
                    <path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"></path>
                </svg>
            </div>
            <div class="pf-step-content">
                <div class="pf-step-header">
                    <h3 class="pf-step-name" th:text="${'1. ' + firstStepTitle}">1. Angaben prüfen</h3>
                    <span class="pf-step-status-tag"
                          th:classappend="${activeStep > 1 ? ' pf-step-status-tag--completed' : ' pf-step-status-tag--active'}"
                          th:text="${activeStep > 1 ? 'Abgeschlossen' : 'Aktiv'}">Aktiv</span>
                </div>
                <p class="pf-step-desc" th:text="${firstStepDescription}">Die Angaben werden geprüft.</p>
            </div>
        </div>

        <div class="pf-step" th:classappend="${activeStep == 2 ? ' is-active' : ' is-upcoming'}" role="listitem">
            <div class="pf-step-badge">
                <svg th:if="${activeStep == 2}" class="pf-spinner-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <circle cx="12" cy="12" r="10" stroke-opacity="0.25"></circle>
                    <path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"></path>
                </svg>
                <span th:if="${activeStep != 2}">2</span>
            </div>
            <div class="pf-step-content">
                <div class="pf-step-header">
                    <h3 class="pf-step-name" th:text="${'2. ' + secondStepTitle}">2. Vorschlag erstellen</h3>
                    <span th:if="${activeStep == 2}" class="pf-step-status-tag pf-step-status-tag--active">Aktiv</span>
                </div>
                <p class="pf-step-desc" th:text="${secondStepDescription}">Der Vorschlag wird erstellt.</p>
            </div>
        </div>
    </div>

    <div class="pf-loading-heartbeat-wrap">
        <div class="pf-loading-heartbeat" role="status">
            <span class="pf-heartbeat-dot" aria-hidden="true"></span>
            <span th:text="${heartbeatText}">Wird verarbeitet</span>
        </div>
    </div>
</th:block>

</body>
</html>
