<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments/layout :: head('Vorlage ansehen')}" />
    <link rel="stylesheet" th:href="@{/css/components/templates.css}">
</head>
<body>
<th:block th:replace="~{fragments/layout :: site-header}" />
<main>
    <div class="pf-page-header">
        <div class="pf-page-header__left">
            <a th:href="${backUrl}" class="pf-page-header__back">← Zurück zum Vorlagenkatalog</a>
            <div class="pf-cluster" style="align-items: center; gap: 0.5rem; flex-wrap: wrap;">
                <h1 th:text="${template.title}" style="margin:0">Vorlage</h1>
                <span class="pf-badge pf-badge--blue">Vorlage · schreibgeschützt</span>
                <span class="pf-badge pf-badge--gray" th:text="${template.subcategory != null ? template.subcategory.label : (template.category != null ? template.category.label : 'Sonstiges')}">Kategorie</span>
            </div>
            <p class="pf-page-header__subtitle" th:text="${template.description}" style="margin-bottom: 0.5rem;"></p>
            <div class="pf-template-summary-meta">
                <span class="pf-meta-chip"><strong th:text="${template.taskCount}">0</strong> Aufgaben</span>
                <span class="pf-meta-chip"><strong th:text="${template.milestoneCount}">0</strong> Meilensteine</span>
                <span th:if="${template.recommendedDurationDays != null}" class="pf-meta-chip" th:text="${'Empfohlene Dauer: ' + template.recommendedDurationDays + ' Tage'}"></span>
                <span class="pf-meta-chip" th:text="${'Geeignet für: ' + template.collaborationMode.label}"></span>
            </div>
        </div>
        <div class="pf-page-header__actions">
            <button th:if="${wizardContext}" type="submit" form="wizard-cancel-form" class="pf-btn pf-btn--ghost pf-btn--sm" style="color: var(--pf-text-muted);"
                    data-confirm="Möchtest du die Projekterstellung wirklich abbrechen? Alle bisherigen Eingaben werden gelöscht."
                    data-confirm-title="Projekterstellung abbrechen?"
                    data-confirm-btn="Erstellung abbrechen"
                    data-confirm-variant="danger">
                Erstellung abbrechen
            </button>
            <form th:if="${wizardContext}" th:action="@{/projects/new/template/{id}(id=${template.id})}" method="post">
                <button class="pf-btn pf-btn--primary" type="submit">Vorlage verwenden →</button>
            </form>
            <a th:unless="${wizardContext}" sec:authorize="isAuthenticated()" th:href="@{/projects/new(templateId=${template.id})}" class="pf-btn pf-btn--primary">Vorlage verwenden →</a>
            <a th:unless="${wizardContext}" sec:authorize="!isAuthenticated()" th:href="@{/projects/new(templateId=${template.id})}" class="pf-btn pf-btn--primary">Anmelden und Vorlage verwenden →</a>
            <form th:if="${wizardContext}" id="wizard-cancel-form" th:action="@{/projects/new/cancel}" method="post"
                  style="display: none;"></form>
        </div>
    </div>

    <section>
        <section th:each="section : ${template.sections}" class="pf-plan-section plan-phase pf-template-phase">
            <header class="pf-plan-section__header">
                <div class="pf-phase-header__left">
                    <button type="button" class="pf-phase-toggle-btn" aria-label="Bereich auf- oder zuklappen" title="Bereich auf- oder zuklappen" aria-expanded="true" th:attr="aria-controls=${'template-section-content-' + section.id}">
                        <svg class="pf-phase-caret" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </button>
                    <div class="pf-phase-display-wrap">
                        <strong class="pf-phase-title" th:text="${section.title}">Phase</strong>
                        <small th:if="${section.description}" th:text="${section.description}" class="pf-phase-desc"></small>
                    </div>
                </div>
                <div class="pf-phase-header__right">
                    <span class="pf-badge pf-badge--blue" th:text="${template.tasks.?[planSectionId == section.id].size() + (template.tasks.?[planSectionId == section.id].size() == 1 ? ' Aufgabe' : ' Aufgaben')}">0 Aufgaben</span>
                </div>
            </header>
            <ul class="pf-element-list pf-collapsible-content" th:id="${'template-section-content-' + section.id}">
                <li th:each="task : ${template.tasks}" th:if="${task.planSectionId == section.id}" class="pf-element-item pf-element-item--task">
                    <div class="pf-element-item__main">
                        <div class="pf-element-header-row">
                            <div class="pf-element-header-left">
                                <span class="pf-element-item__icon pf-element-item__icon--task" aria-hidden="true">○</span>
                                <strong class="pf-element-title" th:text="${task.title}"></strong>
                            </div>
                            <div class="pf-element-meta">
                                <span th:if="${task.priority != null}" class="pf-badge pf-badge--sm"
                                      th:classappend="${task.priority.name() == 'HIGH' ? 'pf-badge--red' : (task.priority.name() == 'LOW' ? 'pf-badge--gray' : 'pf-badge--yellow')}"
                                      th:text="${task.priority.name() == 'LOW' ? 'Priorität: Niedrig' : (task.priority.name() == 'HIGH' ? 'Priorität: Hoch' : 'Priorität: Mittel')}"></span>
                                <span th:if="${task.estimatedMinutes != null}" class="pf-badge pf-badge--sm pf-badge--outline"
                                      th:text="${'Aufwand: ' + task.formattedEffort}"></span>
                                <span th:if="${task.startDate != null}" class="pf-badge pf-badge--sm pf-badge--outline"
                                      th:text="${'ab ' + #temporals.format(task.startDate, 'dd.MM.yyyy')}"></span>
                                <span th:if="${task.dueDate != null}" class="pf-badge pf-badge--sm pf-badge--outline"
                                      th:text="${'Fällig: ' + #temporals.format(task.dueDate, 'dd.MM.yyyy')}"></span>
                                <span th:if="${task.relativeStartDay != null}" class="pf-badge pf-badge--sm pf-badge--outline"
                                      th:text="${'Start: Tag ' + task.relativeStartDay + ' ab Projektstart'}"></span>
                                <span th:if="${task.relativeDueDay != null}" class="pf-badge pf-badge--sm pf-badge--outline"
                                      th:text="${'Fällig: Tag ' + task.relativeDueDay + ' ab Projektstart'}"></span>
                            </div>
                        </div>
                        <p th:if="${task.description}" th:text="${task.description}" class="pf-element-desc"></p>
                    </div>
                </li>
                <li th:each="milestone : ${template.milestones}" th:if="${milestone.planSectionId == section.id}" class="pf-element-item pf-element-item--milestone">
                    <div class="pf-element-item__main">
                        <div class="pf-element-header-row">
                                <button type="button" class="pf-milestone-icon-indicator pf-info-tooltip"
                                        data-tooltip="Meilenstein: Markiert ein wichtiges Zwischenziel im Projekt."
                                        title="Meilenstein: Markiert ein wichtiges Zwischenziel im Projekt."
                                        aria-label="Was ist ein Meilenstein?">
                                    <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                        <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path>
                                        <line x1="4" y1="22" x2="4" y2="15" stroke-width="2"></line>
                                    </svg>
                                </button>
                                <strong class="pf-element-title" th:text="${milestone.title}"></strong>
                            </div>
                            <div class="pf-element-meta" th:if="${milestone.dueDate != null or milestone.relativeDueDay != null}">
                                <span th:if="${milestone.dueDate != null}" class="pf-badge pf-badge--sm pf-badge--outline"
                                      th:text="${'Termin: ' + #temporals.format(milestone.dueDate, 'dd.MM.yyyy')}"></span>
                                <span th:if="${milestone.relativeDueDay != null}" class="pf-badge pf-badge--sm pf-badge--outline"
                                      th:text="${'Termin: Tag ' + milestone.relativeDueDay + ' ab Projektstart'}"></span>
                            </div>
                        </div>
                        <p th:if="${milestone.description}" th:text="${milestone.description}" class="pf-element-desc"></p>
                    </div>
                </li>
            </ul>
        </section>
        <section th:if="${template.tasks.?[planSectionId == null].size() + template.milestones.?[planSectionId == null].size() > 0}" class="pf-plan-section plan-phase pf-template-phase">
            <header class="pf-plan-section__header">
                <div class="pf-phase-header__left">
                    <button type="button" class="pf-phase-toggle-btn" aria-label="Bereich auf- oder zuklappen" title="Bereich auf- oder zuklappen" aria-expanded="true" aria-controls="template-unsectioned-content">
                        <svg class="pf-phase-caret" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </button>
                    <div class="pf-phase-display-wrap">
                        <strong class="pf-phase-title">Ohne Phase</strong>
                    </div>
                </div>
                <div class="pf-phase-header__right">
                    <span class="pf-badge pf-badge--blue" th:text="${template.tasks.?[planSectionId == null].size() + (template.tasks.?[planSectionId == null].size() == 1 ? ' Aufgabe' : ' Aufgaben')}">0 Aufgaben</span>
                </div>
            </header>
            <ul class="pf-element-list pf-collapsible-content" id="template-unsectioned-content">
                <li th:each="task : ${template.tasks}" th:if="${task.planSectionId == null}" class="pf-element-item pf-element-item--task">
                    <div class="pf-element-item__main">
                        <div class="pf-element-header-row">
                            <div class="pf-element-header-left">
                                <span class="pf-element-item__icon pf-element-item__icon--task" aria-hidden="true">○</span>
                                <strong class="pf-element-title" th:text="${task.title}"></strong>
                            </div>
                            <div class="pf-element-meta">
                                <span th:if="${task.priority != null}" class="pf-badge pf-badge--sm"
                                      th:classappend="${task.priority.name() == 'HIGH' ? 'pf-badge--red' : (task.priority.name() == 'LOW' ? 'pf-badge--gray' : 'pf-badge--yellow')}"
                                      th:text="${task.priority.name() == 'LOW' ? 'Priorität: Niedrig' : (task.priority.name() == 'HIGH' ? 'Priorität: Hoch' : 'Priorität: Mittel')}"></span>
                                <span th:if="${task.estimatedMinutes != null}" class="pf-badge pf-badge--sm pf-badge--outline"
                                      th:text="${'Aufwand: ' + task.formattedEffort}"></span>
                                <span th:if="${task.startDate != null}" class="pf-badge pf-badge--sm pf-badge--outline"
                                      th:text="${'ab ' + #temporals.format(task.startDate, 'dd.MM.yyyy')}"></span>
                                <span th:if="${task.dueDate != null}" class="pf-badge pf-badge--sm pf-badge--outline"
                                      th:text="${'Fällig: ' + #temporals.format(task.dueDate, 'dd.MM.yyyy')}"></span>
                                <span th:if="${task.relativeStartDay != null}" class="pf-badge pf-badge--sm pf-badge--outline"
                                      th:text="${'Start: Tag ' + task.relativeStartDay + ' ab Projektstart'}"></span>
                                <span th:if="${task.relativeDueDay != null}" class="pf-badge pf-badge--sm pf-badge--outline"
                                      th:text="${'Fällig: Tag ' + task.relativeDueDay + ' ab Projektstart'}"></span>
                            </div>
                        </div>
                        <p th:if="${task.description}" th:text="${task.description}" class="pf-element-desc"></p>
                    </div>
                </li>
                <li th:each="milestone : ${template.milestones}" th:if="${milestone.planSectionId == null}" class="pf-element-item pf-element-item--milestone">
                    <div class="pf-element-item__main">
                        <div class="pf-element-header-row">
                                <button type="button" class="pf-milestone-icon-indicator pf-info-tooltip"
                                        data-tooltip="Meilenstein: Markiert ein wichtiges Zwischenziel im Projekt."
                                        title="Meilenstein: Markiert ein wichtiges Zwischenziel im Projekt."
                                        aria-label="Was ist ein Meilenstein?">
                                    <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                        <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path>
                                        <line x1="4" y1="22" x2="4" y2="15" stroke-width="2"></line>
                                    </svg>
                                </button>
                                <strong class="pf-element-title" th:text="${milestone.title}"></strong>
                            </div>
                            <div class="pf-element-meta" th:if="${milestone.dueDate != null or milestone.relativeDueDay != null}">
                                <span th:if="${milestone.dueDate != null}" class="pf-badge pf-badge--sm pf-badge--outline"
                                      th:text="${'Termin: ' + #temporals.format(milestone.dueDate, 'dd.MM.yyyy')}"></span>
                                <span th:if="${milestone.relativeDueDay != null}" class="pf-badge pf-badge--sm pf-badge--outline"
                                      th:text="${'Termin: Tag ' + milestone.relativeDueDay + ' ab Projektstart'}"></span>
                            </div>
                        </div>
                        <p th:if="${milestone.description}" th:text="${milestone.description}" class="pf-element-desc"></p>
                    </div>
                </li>
            </ul>
        </section>
    </section>
</main>
<th:block th:replace="~{fragments/layout :: site-footer}" />
<script th:src="@{/js/template-detail.js}"></script>
</body>
</html>
