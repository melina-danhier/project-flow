<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Vorlagen – ProjectFlow</title></head>
<body><main><h1>Projektvorlagen</h1>
<p th:if="${creationFlow != null}">Die Projektdaten sind temporär gespeichert. Wähle später hier eine Vorlage aus.</p>
<ul>
<li th:each="template : ${templates}"><a th:href="@{/templates/{id}(id=${template.id})}" th:text="${template.title}"></a></li>
</ul>
<form th:if="${creationFlow != null}" th:action="@{/projects/new/cancel}" method="post">
    <button type="submit">Projekterstellung abbrechen</button>
</form>
<a th:unless="${creationFlow != null}" th:href="@{/projects}">Zurück</a></main></body></html>
