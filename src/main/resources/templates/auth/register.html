<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head('Registrieren')}" />
</head>
<body>
<th:block th:replace="~{fragments/layout :: site-header}" />

<main>
    <div class="pf-auth-container">
        <div class="pf-auth-card">
            <div style="text-align: center; margin-bottom: 1.5rem;">
                <div class="brand__mark" style="margin: 0 auto 1rem; width: 44px; height: 44px;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width: 24px; height: 24px;">
                        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                        <polyline points="2 17 12 22 22 17"></polyline>
                        <polyline points="2 12 12 17 22 12"></polyline>
                    </svg>
                </div>
                <h1>Konto erstellen</h1>
                <p class="subtitle">Erstelle deinen persönlichen ProjectFlow-Arbeitsbereich.</p>
            </div>

            <form id="register-form" th:action="@{/register}" th:object="${registrationForm}" method="post">
                <div th:if="${#fields.hasErrors('*')}" class="pf-alert pf-alert--error" role="alert">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <span>Bitte überprüfe deine Angaben. Einige Felder enthalten Fehler.</span>
                </div>

                <div class="pf-form-group">
                    <label for="displayName" class="pf-label">Anzeigename</label>
                    <input id="displayName" class="pf-input" type="text" th:field="*{displayName}" required maxlength="100" placeholder="z. B. Alex Miller">
                    <div th:if="${#fields.hasErrors('displayName')}" class="pf-alert pf-alert--error" th:errors="*{displayName}" role="alert"></div>
                </div>

                <div class="pf-form-group">
                    <label for="email" class="pf-label">E-Mail-Adresse</label>
                    <input id="email" class="pf-input" type="email" th:field="*{email}" required maxlength="254" placeholder="alex@beispiel.de">
                    <div th:if="${#fields.hasErrors('email')}" class="pf-alert pf-alert--error" th:errors="*{email}" role="alert"></div>
                </div>

                <div class="pf-form-group">
                    <label for="password" class="pf-label">Passwort</label>
                    <input id="password" class="pf-input" type="password" th:field="*{password}" autocomplete="new-password" required minlength="8" maxlength="128" placeholder="Mind. 8 Zeichen">
                    <div th:if="${#fields.hasErrors('password')}" class="pf-alert pf-alert--error" th:errors="*{password}" role="alert"></div>
                </div>

                <div class="pf-form-group">
                    <label for="passwordConfirmation" class="pf-label">Passwort wiederholen</label>
                    <input id="passwordConfirmation" class="pf-input" type="password" th:field="*{passwordConfirmation}" autocomplete="new-password" required placeholder="Passwort bestätigen">
                    <div th:if="${#fields.hasErrors('passwordConfirmation')}" class="pf-alert pf-alert--error" th:errors="*{passwordConfirmation}" role="alert"></div>
                    <div id="password-mismatch-msg" class="pf-hint" style="color: var(--pf-danger); display: none; margin-top: 0.35rem;">
                        Die Passwörter stimmen nicht überein.
                    </div>
                </div>

                <button id="register-submit-btn" type="submit" class="pf-btn pf-btn--primary" style="width: 100%; margin-top: 1.25rem;">
                    Jetzt registrieren
                </button>
            </form>

            <script>
                (() => {
                    const pwd = document.getElementById('password');
                    const confirm = document.getElementById('passwordConfirmation');
                    const msg = document.getElementById('password-mismatch-msg');
                    const form = document.getElementById('register-form');
                    if (!pwd || !confirm || !msg || !form) return;

                    const checkMatch = () => {
                        if (confirm.value.length > 0 && pwd.value !== confirm.value) {
                            msg.style.display = 'block';
                            confirm.setCustomValidity('Die Passwörter stimmen nicht überein.');
                        } else {
                            msg.style.display = 'none';
                            confirm.setCustomValidity('');
                        }
                    };
                    pwd.addEventListener('input', checkMatch);
                    confirm.addEventListener('input', checkMatch);
                })();
            </script>

            <div class="pf-auth-footer">
                Bereits registriert? <a th:href="@{/login}">Zur Anmeldung →</a>
            </div>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: site-footer}" />
</body>
</html>
