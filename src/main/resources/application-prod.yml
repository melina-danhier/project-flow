spring:
  thymeleaf:
    cache: true

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true

projectflow:
  ai:
    # Startup recovery remains active. Set a cron expression explicitly only if
    # periodic fallback recovery is required in the production environment.
    recovery-cron: "${AI_RECOVERY_CRON:-}"

server:
  port: ${PORT:8080}
  address: 0.0.0.0
  forward-headers-strategy: framework

  servlet:
    session:
      cookie:
        secure: true
