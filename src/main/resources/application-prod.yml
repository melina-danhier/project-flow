spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true

server:
  port: ${PORT:8080}
  address: 0.0.0.0
  forward-headers-strategy: framework

  servlet:
    session:
      cookie:
        secure: true