spring:
  application:
    name: ProjectFlow

  profiles:
    default: dev

  jpa:
    open-in-view: false

server:
  servlet:
    session:
      timeout: 60m
      cookie:
        http-only: true
        same-site: lax
        secure: false

projectflow:
  ai:
    recovery-delay: ${AI_RECOVERY_DELAY:30s}
    stale-workflow-timeout: ${AI_STALE_WORKFLOW_TIMEOUT:5m}
    max-run-time: ${PROJECTFLOW_AI_MAX_RUN_TIME:5m}
    provider: ${PROJECTFLOW_AI_PROVIDER:stub}
    max-attempts: ${PROJECTFLOW_AI_MAX_ATTEMPTS:3}
    retry-initial-delay: ${PROJECTFLOW_AI_RETRY_INITIAL_DELAY:1s}
    openai:
      api-key: ${OPENAI_API_KEY:}
      pre-check-model: ${OPENAI_PRE_CHECK_MODEL:gpt-5-mini}
      generation-model: ${OPENAI_GENERATION_MODEL:gpt-5-mini}
      timeout: ${OPENAI_TIMEOUT:60s}
      max-output-tokens: ${OPENAI_MAX_OUTPUT_TOKENS:16384}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      pre-check-model: ${GEMINI_PRE_CHECK_MODEL:gemini-2.5-flash}
      generation-model: ${GEMINI_GENERATION_MODEL:gemini-2.5-flash}
      timeout: ${GEMINI_TIMEOUT:60s}
      max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:16384}
